<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PicCutter · 在线图片拼接工具</title>
    <meta name="description" content="PicCutter 是一个轻量级的在线图片拼接工具，支持横向和纵向拼接，无需上传，所有处理在本地完成。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="./assets/index-jfxuBQzM.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/react-gnekP6Y0.js">
    <link rel="modulepreload" crossorigin href="./assets/lucide-BTfkRf8K.js">
    <link rel="stylesheet" crossorigin href="./assets/index-BGYa3DGE.css">
  </head>
  <body>
    <div id="root"></div>
    <style>
      .preview-fit { overflow: hidden !important; max-height: none !important; min-height: 0 !important; }
      .preview-fit > .p-3 { display: block !important; position: relative; padding: 12px !important; }
      .preview-fit .preview-scaler { --fit-scale: 1; --zoom-scale: 1; transform: scale(calc(var(--fit-scale) * var(--zoom-scale))); transform-origin: top left; display: block; }
    </style>
    <script>
    (function(){
      function applyFit(){
        var list = document.querySelectorAll('[class*="overflow-auto"][class*="scroll-thin"][class*="bg-ocean"]');
        for (var i=0;i<list.length;i++){
          var box = list[i];
          var pad = box.querySelector('.p-3');
          if (!pad) continue;
          var kids = pad.children;
          var grid = null;
          for (var k=0;k<kids.length;k++){
            if (kids[k].style && kids[k].style.width && kids[k].style.height) {
              grid = kids[k]; break;
            }
          }
          if (!grid) continue;
          var w = parseFloat(grid.style.width);
          var h = parseFloat(grid.style.height);
          if (!w || !h || isNaN(w) || isNaN(h)) continue;
          box.classList.add('preview-fit');
          grid.classList.add('preview-scaler');
          var availW = Math.max(box.clientWidth - 24, 100);
          var availH = Math.max(box.clientHeight - 24, 150);
          var s = Math.min(1, availW / w, availH / h);
          var z = window.__canvasZoom || 1;
          grid.style.setProperty('--fit-scale', s);
          grid.style.setProperty('--zoom-scale', z);
          window.__fitScale = s;
          pad.style.display = 'block';
          pad.style.position = 'relative';
          pad.style.height = (h * s * z + 24) + 'px';
        }
      }
      var t1=null,t2=null,t3=null;
      function schedule(){ clearTimeout(t1); t1 = setTimeout(applyFit, 60); }
      var mo = new MutationObserver(schedule);
      try {
        mo.observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['style','class'] });
      } catch(e) {}
      if (typeof ResizeObserver !== 'undefined') {
        var ro = new ResizeObserver(function(){ clearTimeout(t2); t2 = setTimeout(applyFit, 80); });
        ro.observe(document.documentElement);
      }
      window.addEventListener('resize', function(){ clearTimeout(t3); t3 = setTimeout(applyFit, 100); });
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', applyFit);
      } else {
        applyFit();
      }
      window.addEventListener('load', function(){ setTimeout(applyFit, 200); });
      setTimeout(applyFit, 500);
    })();
    </script>
  </body>
</html>
