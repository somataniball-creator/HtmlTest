<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PicCutter · 网格拼图</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f0f14;
  --surface:#1a1a24;
  --surface2:#252532;
  --border:#333344;
  --border-active:#4f8cff;
  --text:#f0f0f5;
  --text-dim:#8888a0;
  --accent:#4f8cff;
  --accent-hover:#3a78ee;
  --danger:#ef4444;
  --danger-hover:#dc2626;
  --cell-gap:0px;
  --outer-gap:0px;
  --cell-radius:0px;
  --gap-color:#1a1a24;
  --toolbar-h:56px;
  --tabbar-h:230px;
  --tabbar-tab-h:44px;
}
html,body{width:100%;height:100%;overflow:hidden}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  height:100%;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
}

/* 顶部工具栏 */
.topbar{
  height:var(--toolbar-h);
  background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  flex-shrink:0;
}
.topbar-left{display:flex;align-items:center;gap:14px}
.topbar-right{display:flex;align-items:center;gap:8px}
.logo{font-size:1rem;font-weight:700;letter-spacing:.5px}
.logo span{color:var(--accent)}
.count-info{font-size:.8rem;color:var(--text-dim)}
.action-btn{
  padding:7px 14px;
  background:var(--accent);
  border:none;
  border-radius:8px;
  color:#fff;
  cursor:pointer;
  font-size:.85rem;
  font-weight:500;
  transition:all .15s;
}
.action-btn:hover{background:var(--accent-hover)}
.action-btn.danger{background:var(--surface2);border:1px solid var(--border);color:var(--text)}
.action-btn.danger:hover{border-color:var(--danger);color:var(--danger)}
.action-btn:disabled{opacity:.4;cursor:not-allowed}

/* 网格区域 */
.grid-wrap{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:10px;
  overflow:hidden;
  min-height:0;
  height:calc(100% - var(--toolbar-h) - var(--tabbar-h));
  position:relative;
}
.grid-wrap-inner{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  transform-origin:center center;
  will-change:transform;
}
.grid{
  display:grid;
  gap:var(--cell-gap);
  background:var(--gap-color);
  padding:var(--outer-gap);
  border-radius:0;
  border:1px solid var(--border);
  width:calc(100vh - var(--toolbar-h) - var(--tabbar-h) - 20px);
  max-width:calc(100vw - 20px);
  aspect-ratio:1/1;
  flex-shrink:0;
}
.cell{
  background:var(--surface2);
  position:relative;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  transition:all .15s;
  background-size:cover;
  background-position:center;
  border-radius:var(--cell-radius);
}
.cell:hover{background-color:#2a2a38}
.cell.filled{
  border-radius:var(--cell-radius);
}
.cell.filled .placeholder{display:none}
.cell .placeholder{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--text-dim);
  font-size:.75rem;
  gap:4px;
  pointer-events:none;
  border:2px dashed var(--border);
  border-radius:8px;
  width:calc(100% - 8px);
  height:calc(100% - 8px);
  box-sizing:border-box;
}
.cell .placeholder svg{width:24px;height:24px;opacity:.6}
.cell .remove-btn{
  position:absolute;top:3px;right:3px;
  width:20px;height:20px;
  background:rgba(0,0,0,.6);
  border:none;border-radius:50%;
  color:#fff;cursor:pointer;
  display:none;align-items:center;justify-content:center;
  font-size:12px;line-height:1;padding:0;
}
.cell.filled:hover .remove-btn{display:flex}
.cell .remove-btn:hover{background:var(--danger)}
.cell .idx{
  position:absolute;bottom:4px;left:6px;
  font-size:.65rem;
  color:rgba(255,255,255,.5);
  background:rgba(0,0,0,.3);
  padding:1px 5px;border-radius:3px;
}

/* 底部选项栏 */
.tabbar{
  height:var(--tabbar-h);
  background:var(--surface);
  border-top:1px solid var(--border);
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.tabbar-tabs{
  display:flex;
  height:var(--tabbar-tab-h);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.tabbar-tab{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  background:none;
  border:none;
  border-bottom:2px solid transparent;
  color:var(--text-dim);
  cursor:pointer;
  font-size:.85rem;
  font-weight:600;
  letter-spacing:.5px;
  transition:all .15s;
}
.tabbar-tab.active{
  color:var(--text);
  border-bottom-color:var(--accent);
}
.tabbar-panel{
  flex:1;
  display:none;
  align-items:center;
  justify-content:center;
  padding:8px 14px 10px;
  overflow:hidden;
}
.tabbar-panel.active{display:flex}

.tabbar-row{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}
.tabbar-slider-val{
  font-size:.82rem;
  color:var(--text);
  font-weight:600;
  min-width:42px;
  text-align:right;
}

/* 相框样式 2x2 grid：一行两个滑动条，空间压缩 */
.frame-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px 14px;
  width:100%;
  max-width:640px;
}
.frame-slider,
.frame-color{
  display:flex;
  flex-direction:column;
  gap:4px;
  min-width:0;
}
.frame-slider-head,
.frame-color .frame-slider-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.frame-slider-body,
.frame-color-body{
  display:flex;align-items:center;gap:8px;width:100%;
}
.frame-slider-body input[type=range],
.frame-color-body input[type=range]{
  flex:1;
  height:5px;
  -webkit-appearance:none;
  appearance:none;
  background:var(--surface2);
  border-radius:3px;
  outline:none;
  cursor:pointer;
  accent-color:var(--accent);
  min-width:0;
}
.range-tick{
  font-size:.72rem;
  color:var(--text-dim);
  white-space:nowrap;
}

/* 间隙背景色 按钮：统一 22px，更紧凑 */
.gap-color-btn{
  width:22px;height:22px;
  border-radius:6px;
  border:2px solid #fff;
  box-shadow:0 0 0 1px var(--border);
  cursor:pointer;
  padding:0;
  line-height:1;
  flex-shrink:0;
}
.gap-color-btn[data-gap-color="#000000"]{background:#000}
.gap-color-btn[data-gap-color="#ffffff"]{background:#fff}
.gap-color-custom{
  position:relative;
  width:22px;height:22px;
  border-radius:6px;
  border:2px solid #fff;
  box-shadow:0 0 0 1px var(--border);
  background:conic-gradient(red, yellow, lime, aqua, blue, magenta, red);
  cursor:pointer;
  display:inline-block;
  padding:0;
  overflow:hidden;
  flex-shrink:0;
}
.gap-color-custom input[type=color]{
  position:absolute;inset:0;
  width:100%;height:100%;
  opacity:0;cursor:pointer;
  border:0;padding:0;margin:0;
}

.panel-label{font-size:.78rem;color:var(--text-dim);margin-right:4px}
.panel-btn{
  padding:7px 14px;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--text);
  cursor:pointer;
  font-size:.82rem;
  font-weight:600;
  transition:all .15s;
}
.panel-btn:hover{background:var(--border);border-color:var(--accent)}
.panel-btn.active{background:var(--accent);border-color:var(--accent)}
.placeholder-text{font-size:.8rem;color:var(--text-dim)}

/* 输出设置页签 */
.output-cols{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  width:100%;
  max-width:560px;
  padding:4px 0;
}
.output-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  width:100%;
  flex-wrap:wrap;
}
.output-tip{
  font-size:.72rem;
  color:var(--text-dim);
  text-align:center;
  line-height:1.4;
}

.hint{
  position:fixed;bottom:calc(var(--tabbar-h) + 8px);left:50%;transform:translateX(-50%);
  background:var(--surface);border:1px solid var(--border);
  padding:6px 14px;border-radius:8px;font-size:.75rem;color:var(--text-dim);
  pointer-events:none;z-index:10;
}

@media(max-width:600px){
  :root{--toolbar-h:48px;--tabbar-h:200px;--tabbar-tab-h:38px}
  .topbar{padding:0 10px}
  .topbar-left{gap:10px}
  .logo{font-size:.85rem}
  .action-btn{padding:6px 10px;font-size:.75rem}
  .count-info{font-size:.7rem}
  .grid-wrap{padding:6px}
  .grid{width:calc(100vh - var(--toolbar-h) - var(--tabbar-h) - 12px);max-width:calc(100vw - 12px)}
  .cell .placeholder{font-size:.65rem}
  .cell .placeholder svg{width:18px;height:18px}
  .tabbar-tab{font-size:.72rem;letter-spacing:0;font-weight:500;padding:0 4px}
  .panel-btn{padding:6px 10px;font-size:.75rem}
  .panel-label{font-size:.7rem}
  .frame-grid{gap:6px 10px}
  .frame-slider-val{font-size:.75rem}
  .range-tick{font-size:.68rem}
  .tabbar-slider-val{font-size:.75rem;min-width:36px}
  .gap-color-btn,.gap-color-custom{width:20px;height:20px;border-radius:5px}
  .hint{font-size:.65rem;padding:5px 10px}
}
</style>
</head>
<body>

<!-- 顶部工具栏 -->
<div class="topbar">
  <div class="topbar-left">
    <div class="logo">Pic<span>Cutter</span><span style="color:var(--text-dim);font-size:.7rem;margin-left:6px;font-weight:400;letter-spacing:0">v1.4</span></div>
    <span class="count-info" id="countInfo">0 / 9</span>
  </div>
  <div class="topbar-right">
    <button class="action-btn danger" id="clearBtn">清空</button>
    <button class="action-btn" id="downloadBtn" disabled>下载</button>
  </div>
</div>

<!-- 网格区域 -->
<div class="grid-wrap">
  <div class="grid-wrap-inner" id="gridWrapInner">
    <div class="grid" id="grid"></div>
  </div>
</div>

<!-- 底部选项栏：三个页签 + 相框样式一行两个滑动条压缩空间 -->
<div class="tabbar">
  <div class="tabbar-tabs">
    <button class="tabbar-tab active" data-tab="layout">拼接方式</button>
    <button class="tabbar-tab" data-tab="frame">相框样式</button>
    <button class="tabbar-tab" data-tab="output">输出设置</button>
  </div>
  <div class="tabbar-panel active" data-panel="layout">
    <div class="tabbar-row" style="justify-content:center;width:100%">
      <span class="panel-label">网格</span>
      <button class="panel-btn" data-size="2">2×2</button>
      <button class="panel-btn active" data-size="3">3×3</button>
      <button class="panel-btn" data-size="4">4×4</button>
    </div>
  </div>
  <div class="tabbar-panel" data-panel="frame">
    <div class="frame-grid">
      <div class="frame-slider">
        <div class="frame-slider-head">
          <span class="panel-label" style="margin:0">图片之间</span>
          <span id="cellGapValue" class="tabbar-slider-val">0 px</span>
        </div>
        <div class="frame-slider-body">
          <span class="range-tick">0</span>
          <input type="range" id="cellGapRange" min="0" max="60" value="0" step="1">
          <span class="range-tick">60</span>
        </div>
      </div>
      <div class="frame-slider">
        <div class="frame-slider-head">
          <span class="panel-label" style="margin:0">外边界</span>
          <span id="outerGapValue" class="tabbar-slider-val">0 px</span>
        </div>
        <div class="frame-slider-body">
          <span class="range-tick">0</span>
          <input type="range" id="outerGapRange" min="0" max="80" value="0" step="1">
          <span class="range-tick">80</span>
        </div>
      </div>
      <div class="frame-slider">
        <div class="frame-slider-head">
          <span class="panel-label" style="margin:0">圆角</span>
          <span id="radiusValue" class="tabbar-slider-val">0 px</span>
        </div>
        <div class="frame-slider-body">
          <span class="range-tick">0</span>
          <input type="range" id="radiusRange" min="0" max="60" value="0" step="1">
          <span class="range-tick">60</span>
        </div>
      </div>
      <div class="frame-color">
        <div class="frame-slider-head">
          <span class="panel-label" style="margin:0">背景色</span>
        </div>
        <div class="frame-color-body">
          <button type="button" data-gap-color="#000000" class="gap-color-btn" title="纯黑"></button>
          <button type="button" data-gap-color="#ffffff" class="gap-color-btn" title="纯白"></button>
          <label class="gap-color-custom" title="自定义颜色">
            <input type="color" id="gapColorPicker" value="#1a1a24">
          </label>
          <span id="gapColorLabel" class="tabbar-slider-val" style="margin-left:4px">#1A1A24</span>
        </div>
      </div>
    </div>
  </div>
  <div class="tabbar-panel" data-panel="output">
    <div class="output-cols">
      <div class="output-row">
        <span class="panel-label" style="margin:0">输出清晰度</span>
        <span id="qualityLabel" class="tabbar-slider-val" style="min-width:64px">高清</span>
      </div>
      <div class="output-row" style="gap:6px">
        <button type="button" class="quality-btn panel-btn" data-quality="2000" style="padding:5px 10px;font-size:.75rem">标准 2K</button>
        <button type="button" class="quality-btn panel-btn active" data-quality="2800" style="padding:5px 10px;font-size:.75rem">高清 2.8K</button>
        <button type="button" class="quality-btn panel-btn" data-quality="3600" style="padding:5px 10px;font-size:.75rem">超清 3.6K</button>
        <button type="button" class="quality-btn panel-btn" data-quality="0" style="padding:5px 10px;font-size:.75rem">原图级</button>
      </div>
      <div class="output-tip">
        PNG 无损格式 · 高清为默认推荐档
      </div>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*" multiple style="display:none">
<div class="hint" id="hint">点击空格子添加图片 · 支持多选自动填充</div>

<script>
(function(){
  var gridEl=document.getElementById('grid');
  var fileInput=document.getElementById('fileInput');
  var clearBtn=document.getElementById('clearBtn');
  var downloadBtn=document.getElementById('downloadBtn');
  var countInfo=document.getElementById('countInfo');
  var hint=document.getElementById('hint');
  var currentSize=3;
  var selectedCellIdx=-1;
  var cells=[];
  var currentCellGap = 0;   // 图片与图片之间
  var currentOuterGap = 0;  // 图片与外边界
  var currentRadius = 0;    // 单张图片圆角
  var currentGapColor = '#1a1a24';  // 间隙背景色（grid背景）
  var currentQuality = 2800; // 输出清晰度：0=原图级，>0=目标短边像素
  var cellGapRangeEl = null, cellGapValueEl = null;
  var outerGapRangeEl = null, outerGapValueEl = null;
  var radiusRangeEl = null, radiusValueEl = null;
  var gapColorPickerEl = null, gapColorLabelEl = null;
  var qualityLabelEl = null;

  function toHexColor(c){
    c = (c || '').trim().toLowerCase();
    if (!c) return '#1a1a24';
    // #RGB / #RRGGBB -> 统一 6 位大写
    if (/^#([0-9a-f]{3})$/.test(c)){
      var h = c.slice(1);
      c = '#' + h[0]+h[0] + h[1]+h[1] + h[2]+h[2];
    }
    if (/^#([0-9a-f]{6})$/.test(c)) return c;
    // 其他命名色 / rgb() 扔到临时节点读 computed
    try{
      var d = document.createElement('div');
      d.style.color = c;
      document.body.appendChild(d);
      var rgb = getComputedStyle(d).color;
      document.body.removeChild(d);
      var m = rgb.match(/rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/i);
      if (m){
        return '#' + [+m[1],+m[2],+m[3]].map(function(v){return ('0'+v.toString(16)).slice(-2)}).join('');
      }
    }catch(e){}
    return '#1a1a24';
  }
  function setCellGap(px){
    px = Math.max(0, Math.min(60, Math.floor(px)));
    currentCellGap = px;
    document.documentElement.style.setProperty('--cell-gap', px + 'px');
    if (cellGapValueEl) cellGapValueEl.textContent = px + ' px';
    if (cellGapRangeEl && +cellGapRangeEl.value !== px) cellGapRangeEl.value = String(px);
  }
  function setOuterGap(px){
    px = Math.max(0, Math.min(80, Math.floor(px)));
    currentOuterGap = px;
    document.documentElement.style.setProperty('--outer-gap', px + 'px');
    if (outerGapValueEl) outerGapValueEl.textContent = px + ' px';
    if (outerGapRangeEl && +outerGapRangeEl.value !== px) outerGapRangeEl.value = String(px);
  }
  function setRadius(px){
    px = Math.max(0, Math.min(60, Math.floor(px)));
    currentRadius = px;
    document.documentElement.style.setProperty('--cell-radius', px + 'px');
    if (radiusValueEl) radiusValueEl.textContent = px + ' px';
    if (radiusRangeEl && +radiusRangeEl.value !== px) radiusRangeEl.value = String(px);
  }
  function setGapColor(hexOrName, fromPicker){
    var hex = toHexColor(hexOrName);
    currentGapColor = hex;
    document.documentElement.style.setProperty('--gap-color', hex);
    if (gapColorLabelEl) gapColorLabelEl.textContent = hex.toUpperCase();
    if (!fromPicker && gapColorPickerEl) gapColorPickerEl.value = hex;
    document.querySelectorAll('.gap-color-btn').forEach(function(btn){
      var bc = toHexColor(btn.getAttribute('data-gap-color') || '');
      if (bc === hex) {
        btn.style.boxShadow = '0 0 0 2px var(--accent), 0 0 0 3px #fff';
      } else {
        btn.style.boxShadow = '0 0 0 1px var(--border)';
      }
    });
  }
  function setQuality(px){
    px = (px === 0 || px > 0) ? Math.floor(px) : 2800;
    if (px > 6000) px = 6000; // 安全上限：避免 4 亿+像素手机原图
    currentQuality = px;
    var label = '高清';
    if (px === 0) label = '原图级';
    else if (px <= 2000) label = '标准 2K';
    else if (px <= 2800) label = '高清';
    else label = '超清 3.6K';
    if (qualityLabelEl) qualityLabelEl.textContent = label;
    document.querySelectorAll('.quality-btn').forEach(function(btn){
      var bq = +btn.getAttribute('data-quality');
      btn.classList.toggle('active', bq === px);
    });
  }

  document.addEventListener('DOMContentLoaded', initGapControl, { once: true });
  function initGapControl(){
    cellGapRangeEl = document.getElementById('cellGapRange');
    cellGapValueEl = document.getElementById('cellGapValue');
    outerGapRangeEl = document.getElementById('outerGapRange');
    outerGapValueEl = document.getElementById('outerGapValue');
    radiusRangeEl = document.getElementById('radiusRange');
    radiusValueEl = document.getElementById('radiusValue');
    gapColorPickerEl = document.getElementById('gapColorPicker');
    gapColorLabelEl = document.getElementById('gapColorLabel');
    qualityLabelEl = document.getElementById('qualityLabel');
    if (cellGapRangeEl) cellGapRangeEl.addEventListener('input', function(){ setCellGap(+this.value); });
    if (outerGapRangeEl) outerGapRangeEl.addEventListener('input', function(){ setOuterGap(+this.value); });
    if (radiusRangeEl) radiusRangeEl.addEventListener('input', function(){ setRadius(+this.value); });
    if (gapColorPickerEl) gapColorPickerEl.addEventListener('input', function(){ setGapColor(this.value, true); });
    document.querySelectorAll('.gap-color-btn').forEach(function(btn){
      btn.addEventListener('click', function(){ setGapColor(this.getAttribute('data-gap-color') || '#1a1a24'); });
    });
    document.querySelectorAll('.quality-btn').forEach(function(btn){
      btn.addEventListener('click', function(){ setQuality(+this.getAttribute('data-quality') || 2800); });
    });
    setCellGap(0);
    setOuterGap(0);
    setRadius(0);
    setGapColor('#1a1a24');
    setQuality(2800);
  }
  if (document.readyState === 'complete' || document.readyState === 'interactive'){
    setTimeout(initGapControl, 0);
  }

  // 长按菜单 & 状态
  var LONG_PRESS_MS = 550;
  var longPressTimer = null;
  var longPressIdx = -1;
  var longPressTriggered = false;
  var lpStartX = 0, lpStartY = 0;
  var cellActionMenu = null;
  var menuAnchorCell = null;   // 当前菜单归属的格子（点这个格子不关闭）
  var menuClicked = false;     // 本次按下是否命中菜单项

  function clearLongPressTimer(){
    if (longPressTimer){ clearTimeout(longPressTimer); longPressTimer = null; }
  }
  function closeCellMenu(){
    if (cellActionMenu && cellActionMenu.parentNode){ cellActionMenu.parentNode.removeChild(cellActionMenu); }
    cellActionMenu = null;
    menuAnchorCell = null;
  }
  function isInMenuOrAnchor(target){
    if (!target) return false;
    if (menuAnchorCell && menuAnchorCell.contains(target)) return true;
    if (cellActionMenu && cellActionMenu.contains(target)) return true;
    return false;
  }
  // 唯一关闭入口：按下时（鼠标/触摸）命中「既不在菜单也不在原格子」才关
  document.addEventListener('pointerdown', function(e){
    if (!cellActionMenu) return;
    if (isInMenuOrAnchor(e.target)) return;
    closeCellMenu();
  }, true);
  document.addEventListener('touchstart', function(e){
    if (!cellActionMenu) return;
    var t = e.target;
    if (t && isInMenuOrAnchor(t)) return;
    closeCellMenu();
  }, { passive: true, capture: true });
  // Esc 键也关闭
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') closeCellMenu();
  });

  function openCellMenu(cellEl, idx){
    closeCellMenu();
    menuAnchorCell = cellEl;
    var rect = cellEl.getBoundingClientRect();
    var menu = document.createElement('div');
    menu.style.cssText = 'position:fixed;z-index:9999;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:6px;min-width:140px;box-shadow:0 10px 30px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:2px;';
    function showMenuAt(){
      var w = window.innerWidth, h = window.innerHeight;
      var mw = menu.offsetWidth, mh = menu.offsetHeight;
      var top = rect.bottom + 6;
      var left = rect.left + rect.width/2 - mw/2;
      if (top + mh > h - 8) { top = Math.max(8, rect.top - mh - 6); }
      if (left < 8) left = 8;
      if (left + mw > w - 8) left = Math.max(8, w - mw - 8);
      menu.style.top = top + 'px';
      menu.style.left = left + 'px';
    }
    function item(label, onClick, danger){
      var btn = document.createElement('button');
      btn.textContent = label;
      btn.style.cssText = 'display:block;width:100%;background:none;border:none;text-align:left;padding:9px 12px;border-radius:6px;color:'+(danger?'var(--danger)':'var(--text)')+';font-size:.9rem;cursor:pointer;font-weight:500;white-space:nowrap;';
      btn.addEventListener('mouseenter', function(){ btn.style.background = 'var(--surface2)'; });
      btn.addEventListener('mouseleave', function(){ btn.style.background = 'none'; });
      btn.addEventListener('click', function(){ closeCellMenu(); setTimeout(onClick, 0); });
      btn.addEventListener('touchend', function(e){ e.preventDefault(); closeCellMenu(); setTimeout(onClick, 0); }, { passive: false });
      return btn;
    }
    menu.appendChild(item('替换图片', function(){
      selectedCellIdx = idx;
      fileInput.value = '';
      fileInput.setAttribute('data-replace', '1');
      fileInput.click();
    }));
    menu.appendChild(item('移除图片', function(){
      if (confirm('确定移除这张图片？')) { cells[idx] = null; render(); updateCount(); }
    }, true));
    document.body.appendChild(menu);
    requestAnimationFrame(function(){
      showMenuAt();
      cellActionMenu = menu;
    });
    window.addEventListener('resize', showMenuAt, { once: true });
  }

  function buildGrid(n){
    currentSize=n;
    var total=n*n;
    var old=cells.slice();
    cells=[];
    for(var i=0;i<total;i++){cells.push(old[i]||null);}
    render();
    updateCount();
  }

  function render(){
    var n=currentSize;
    gridEl.style.gridTemplateColumns='repeat('+n+',1fr)';
    gridEl.style.gridTemplateRows='repeat('+n+',1fr)';
    gridEl.innerHTML='';
    for(var i=0;i<cells.length;i++){
      var cell=document.createElement('div');
      cell.className='cell'+(cells[i]?' filled':'');
      cell.dataset.idx=i;
      if(cells[i]){
        cell.style.backgroundImage='url('+cells[i]+')';
        cell.innerHTML='<span class="idx">'+(i+1)+'</span>';
        bindCellLongPress(cell, i, true);
      }else{
        cell.innerHTML='<div class="placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8M8 12h8"/></svg><span>点击添加</span></div><span class="idx">'+(i+1)+'</span>';
        bindCellLongPress(cell, i, false);
      }
      cell.addEventListener('click',onCellClick);
      gridEl.appendChild(cell);
    }
  }

  function bindCellLongPress(cell, idx, isFilled){
    // 桌面端：右键
    cell.addEventListener('contextmenu', function(e){
      e.preventDefault();
      if (isFilled) openCellMenu(cell, idx);
    });
    // 通用：mousedown / touchstart 长按计时
    cell.addEventListener('mousedown', function(e){
      if (!isFilled) return;
      if (e.button !== 0) return;
      startLongPress(e.clientX, e.clientY, cell, idx);
    });
    cell.addEventListener('mouseup', clearLongPressTimer);
    cell.addEventListener('mouseleave', clearLongPressTimer);
    cell.addEventListener('mousemove', function(e){
      if (Math.abs(e.clientX - lpStartX) > 8 || Math.abs(e.clientY - lpStartY) > 8) clearLongPressTimer();
    });

    cell.addEventListener('touchstart', function(e){
      if (!isFilled) return;
      var t = e.touches[0];
      startLongPress(t.clientX, t.clientY, cell, idx);
    }, { passive: true });
    cell.addEventListener('touchend', function(e){
      if (longPressTriggered) { e.preventDefault(); }
      clearLongPressTimer();
    });
    cell.addEventListener('touchmove', function(e){
      var t = e.touches[0];
      if (Math.abs(t.clientX - lpStartX) > 8 || Math.abs(t.clientY - lpStartY) > 8) clearLongPressTimer();
    }, { passive: true });
    cell.addEventListener('touchcancel', clearLongPressTimer);
  }

  function startLongPress(x, y, cell, idx){
    longPressIdx = idx;
    longPressTriggered = false;
    lpStartX = x;
    lpStartY = y;
    clearLongPressTimer();
    longPressTimer = setTimeout(function(){
      longPressTriggered = true;
      if (navigator.vibrate) { try { navigator.vibrate(20); } catch(_) {} }
      openCellMenu(cell, idx);
    }, LONG_PRESS_MS);
  }

  function onCellClick(e){
    e.stopPropagation();
    var idx=parseInt(this.dataset.idx);
    // 如果本次是长按触发过的，不执行点击（避免长按后松开导致空格误添加/已填格误触发其他）
    if (longPressTriggered) { longPressTriggered = false; return; }
    if(cells[idx]){
      // 已填图：点击不做替换，需长按出菜单
      return;
    }
    selectedCellIdx=idx;
    fileInput.value='';
    fileInput.removeAttribute('data-replace');
    fileInput.click();
  }

  function updateCount(){
    var filled=cells.filter(Boolean).length;
    var total=cells.length;
    countInfo.textContent=filled+' / '+total;
    downloadBtn.disabled=filled===0;
    hint.style.display=filled>0?'none':'block';
  }

  fileInput.addEventListener('change',function(e){
    var files=Array.from(e.target.files);
    if(!files.length)return;
    var n=currentSize*currentSize;
    var isReplace = fileInput.hasAttribute('data-replace');
    fileInput.removeAttribute('data-replace');
    var idx=selectedCellIdx>=0?selectedCellIdx:0;
    if(!isReplace && cells[idx]){
      // 非替换模式：如果起始格子已有图，则找第一个空格开始
      var firstEmpty = cells.findIndex(function(c){return !c});
      if (firstEmpty >= 0) idx = firstEmpty;
    }
    var fileIdx=0;
    // 替换模式：只覆盖 selectedCellIdx 这一个（第一个文件）
    if (isReplace && selectedCellIdx >= 0) {
      var targetCell = selectedCellIdx;
      var firstFile = files[0];
      var reader=new FileReader();
      reader.onload=function(ev){
        cells[targetCell]=ev.target.result;render();updateCount();
      };
      reader.readAsDataURL(firstFile);
      selectedCellIdx=-1;
      return;
    }
    // 添加模式：从 idx 开始依次填满空格
    for(var i=idx;i<n && fileIdx<files.length;i++){
      if(cells[i])continue;
      (function(targetCell,file){
        var reader=new FileReader();
        reader.onload=function(ev){cells[targetCell]=ev.target.result;render();updateCount();};
        reader.readAsDataURL(file);
      })(i,files[fileIdx++]);
    }
    selectedCellIdx=-1;
  });

  clearBtn.addEventListener('click',function(){
    if(!cells.some(Boolean))return;
    if(!confirm('确定清空所有图片？'))return;
    cells=cells.map(function(){return null});render();updateCount();
  });

  // Tab 切换（拼接方式 / 相框样式）
  document.querySelectorAll('.tabbar-tab').forEach(function(tab){
    tab.addEventListener('click',function(){
      var tabName=this.dataset.tab;
      document.querySelectorAll('.tabbar-tab').forEach(function(t){t.classList.remove('active')});
      document.querySelectorAll('.tabbar-panel').forEach(function(p){p.classList.remove('active')});
      this.classList.add('active');
      var panel = document.querySelector('.tabbar-panel[data-panel="'+tabName+'"]');
      if (panel) panel.classList.add('active');
    });
  });

  // 网格尺寸按钮
  document.querySelectorAll('.panel-btn').forEach(function(btn){
    btn.addEventListener('click',function(){
      document.querySelectorAll('.panel-btn').forEach(function(b){b.classList.remove('active')});
      this.classList.add('active');
      buildGrid(parseInt(this.dataset.size));
    });
  });

  // 下载 / 保存
  downloadBtn.addEventListener('click', downloadCollage);

  var isMobile = /iPhone|iPad|iPod|Android|Mobile/i.test(navigator.userAgent);

  function downloadCollage(){
    var filled = cells.map(function(c, i){return c ? i : -1}).filter(function(i){return i >= 0});
    if (!filled.length) { alert('请先添加图片'); return; }
    downloadBtn.disabled = true;

    var tasks = filled.map(function(idx){
      return new Promise(function(resolve){
        var img = new Image();
        img.onload = function(){ resolve({ img: img, idx: idx }); };
        img.onerror = function(){ resolve({ img: null, idx: idx }); };
        img.src = cells[idx];
      });
    });

    Promise.all(tasks).then(function(results){
      var n = currentSize;
      var cellGapCss = Math.max(0, Math.min(60, Math.floor(currentCellGap)));
      var outerGapCss = Math.max(0, Math.min(80, Math.floor(currentOuterGap)));
      var radiusCss = Math.max(0, Math.min(60, Math.floor(currentRadius)));
      var gapColorCss = toHexColor(currentGapColor || '#1a1a24');
      var quality = (currentQuality > 6000) ? 6000 : (currentQuality >= 0 ? currentQuality : 2800);

      // 1. 确定基准尺寸：quality>0 直接用；quality=0 按所有填图格的 "cover 目标像素最大值" 推导，保证不小于原图
      var baseOut;
      if (quality > 0) {
        baseOut = quality;
      } else {
        var maxCellPx = 0;
        results.forEach(function(r){
          if (r && r.img && r.img.naturalWidth>0 && r.img.naturalHeight>0) {
            // cover 下该图至少需要的单边像素 = min(图宽, 图高)
            var s = Math.min(r.img.naturalWidth, r.img.naturalHeight);
            if (s > maxCellPx) maxCellPx = s;
          }
        });
        if (maxCellPx < 1) maxCellPx = 2000;
        // 图级导出：总边 = n*cell + (n-1)*cellGapCss + 2*outerGapCss（cellGap/outerGap按预览css像素比等价放大）
        var est = Math.ceil(maxCellPx * n + Math.max(0,(n-1)) * cellGapCss + 2 * outerGapCss);
        baseOut = Math.min(6000, est); // 安全上限 6K，避免 1 亿+像素的超大图
      }

      // 2. 预览 → 画布 的比例换算：间隙、圆角、背景色语义完全沿用预览端（k 只作用于间隙/圆角，不影响 cellSize 的推导）
      var gridW = Math.max(1, Math.round(gridEl.getBoundingClientRect().width || 0));
      var k;
      if (gridW > 0) {
        var gridBorderPx = 1;
        var contentW = Math.max(1, gridW - 2*gridBorderPx - 2*outerGapCss);
        var cellW = Math.max(1, Math.floor((contentW - (n-1)*cellGapCss) / n));
        // 注意：这里 k 的目的是把"CSS 像素的间隙/圆角"按预览 cell 比例放大到画布
        var cellTarget = Math.floor((baseOut - 2*outerGapCss - (n-1)*cellGapCss) / n);
        k = cellTarget / Math.max(1, cellW);
      } else {
        k = baseOut / 2000;
      }
      var cellGap = Math.max(0, Math.round(cellGapCss * k));
      var outerGap = Math.max(0, Math.round(outerGapCss * k));
      var radiusPx = Math.max(0, Math.round(radiusCss * k));

      // 3. canvas 尺寸：严格保证 cellSize 完整 + 间隙/外边界正确，允许比 baseOut 大 1~2px 取整
      var cellSize = Math.floor((baseOut - 2*outerGap - (n-1)*cellGap) / n);
      if (cellSize < 1) cellSize = 1;
      var outW = 2*outerGap + n*cellSize + (n-1)*cellGap;
      var r = Math.min(radiusPx, Math.floor(cellSize / 2));
      var canvas = document.createElement('canvas');
      canvas.width = outW; canvas.height = outW;
      var ctx = canvas.getContext('2d');
      // 显式开启高品质平滑：PNG 无损不影响，只抗锯齿让边缘不糊
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';

      // 工具：画圆角矩形路径（兼容旧浏览器手动描弧 + 直线）
      function roundRectPath(x, y, w, h, rr){
        rr = Math.min(rr, Math.floor(w/2), Math.floor(h/2));
        ctx.beginPath();
        if (rr <= 0){
          ctx.rect(x, y, w, h);
          return;
        }
        ctx.moveTo(x + rr, y);
        ctx.lineTo(x + w - rr, y);
        ctx.arcTo(x + w, y, x + w, y + rr, rr);
        ctx.lineTo(x + w, y + h - rr);
        ctx.arcTo(x + w, y + h, x + w - rr, y + h, rr);
        ctx.lineTo(x + rr, y + h);
        ctx.arcTo(x, y + h, x, y + h - rr, rr);
        ctx.lineTo(x, y + rr);
        ctx.arcTo(x, y, x + rr, y, rr);
        ctx.closePath();
      }

      // 第 1 层：整个画布填「间隙背景色」= 用户选的黑/白/自定义
      ctx.fillStyle = gapColorCss;
      ctx.fillRect(0, 0, outW, outW);

      for (var i = 0; i < n * n; i++){
        var col = i % n, row = Math.floor(i / n);
        var x = outerGap + col * (cellSize + cellGap);
        var y = outerGap + row * (cellSize + cellGap);
        var found = results.find(function(r){ return r.idx === i; });
        var hasImg = !!(cells[i] && found && found.img && found.img.complete && found.img.naturalWidth>0);

        // 第 2 层：cell 底色（--surface2 浅色）圆角填充 — 即使有图也先填，防止透明图漏背景
        ctx.save();
        roundRectPath(x, y, cellSize, cellSize, r);
        ctx.fillStyle = '#252532';
        ctx.fill();
        ctx.restore();

        // 第 3 层：图片 cover 填充，裁剪在圆角矩形内
        if (hasImg){
          ctx.save();
          roundRectPath(x, y, cellSize, cellSize, r);
          ctx.clip();
          var img = found.img;
          var iw = img.naturalWidth, ih = img.naturalHeight;
          // 高保真：优先整像素对齐 scale → 再对齐中心（dx/dy 取整避免半像素采样）
          var rawScale = Math.max(cellSize / iw, cellSize / ih);
          var dw = Math.round(iw * rawScale);
          var dh = Math.round(ih * rawScale);
          var dx = Math.round(x + (cellSize - dw) / 2);
          var dy = Math.round(y + (cellSize - dh) / 2);
          ctx.drawImage(img, dx, dy, dw, dh);
          ctx.restore();
        }
      }

      // 关键修复：显式指定 image/png（无损、不做 chroma 下采样、透明/圆角保真）
      // 第三个参数虽 PNG 不使用 quality 语义，但显式传 1 防止浏览器走"默认有损优化路径"
      canvas.toBlob(function(blob){
        if (!blob) { downloadBtn.disabled = false; return; }
        var url = URL.createObjectURL(blob);
        var tag = [];
        if (cellGapCss>0) tag.push('c'+cellGapCss);
        if (outerGapCss>0) tag.push('o'+outerGapCss);
        if (radiusCss>0)  tag.push('r'+radiusCss);
        var hx = gapColorCss.replace('#','').toUpperCase();
        if (hx === '000000') tag.push('bgBLACK');
        else if (hx === 'FFFFFF') tag.push('bgWHITE');
        else tag.push('bg'+hx);
        var qTag;
        if (quality === 0) qTag = 'qORIGINAL';
        else if (quality <= 2000) qTag = 'q2K';
        else if (quality <= 2800) qTag = 'q2_8K';
        else qTag = 'q3_6K';
        tag.push(qTag);
        var tagStr = tag.length ? ('_' + tag.join('_')) : '';
        var fileName = 'piccutter_' + n + 'x' + n + tagStr + '.png';

        if (isMobile){
          // iPhone：优先调系统分享面板（里面有"存储图像"），同时展示预览+手动保存备选
          var file = new File([blob], fileName, { type: 'image/png' });
          var canShare = !!(navigator.share && navigator.canShare && navigator.canShare({ files: [file] }));
          if (canShare) {
            navigator.share({
              title: 'PicCutter 拼图',
              text: fileName,
              files: [file]
            }).then(function(){
              downloadBtn.disabled = false;
              setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
            }).catch(function(){
              // 用户取消或分享失败，兜底展示预览 overlay
              showSaveOverlay(url, blob, fileName);
            });
          } else {
            // 不支持文件分享，展示预览 overlay
            showSaveOverlay(url, blob, fileName);
          }
        } else {
          // 桌面端：直接下载
          var a = document.createElement('a');
          a.href = url;
          a.setAttribute('download', fileName);
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function(){ URL.revokeObjectURL(url); downloadBtn.disabled = false; }, 2000);
        }
      }, 'image/png', 1.0);
    });
  }

  // 移动端保存到相册的 overlay（备选：支持直接调系统分享 + 长按保存）
  function showSaveOverlay(imgUrl, blob, fileName){
    var overlay = document.createElement('div');

    shareBtn.style.cssText = 'padding:11px 24px;background:var(--accent);border:none;border-radius:8px;color:#fff;font-size:.95rem;font-weight:500;cursor:pointer;';

    var longPressBtn = document.createElement('button');
    longPressBtn.textContent = '长按保存';
    longPressBtn.style.cssText = 'padding:11px 20px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:8px;color:#fff;font-size:.9rem;cursor:pointer;';

    var closeBtn = document.createElement('button');

    closeBtn.style.cssText = 'padding:11px 20px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);border-radius:8px;color:var(--text-dim);font-size:.9rem;cursor:pointer;';

    var closeOverlay = function(){

      alert('当前浏览器不支持分享，请长按上方图片保存');

  }

  buildGrid(3);

  /* ============== 网格缩放：滚轮 + 双指 pinch，以区域中心为锚点 ============== */
  var wrapInner = document.getElementById('gridWrapInner');
  var wrapOuter = wrapInner.parentElement;
  var gridScale = 1;
  var MIN_SCALE = 0.5;
  var MAX_SCALE = 5.0;
  var panX = 0, panY = 0;
  var isPanning = false;
  var panStartX = 0, panStartY = 0;
  var touchMoved = false;
  var lastTouchX = 0, lastTouchY = 0;

  function applyTransform() {
    wrapInner.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + gridScale + ')';
  }
  function resetPan() { panX = 0; panY = 0; }

  // PC 滚轮缩放
  wrapOuter.addEventListener('wheel', function (e) {
    e.preventDefault();
    var delta = -e.deltaY * 0.0025;
    var old = gridScale;
    gridScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, gridScale + delta));
    if (gridScale <= 1.0) { gridScale = 1; resetPan(); applyTransform(); return; }
    applyAnchorZoom(e.clientX, e.clientY, wrapOuter.getBoundingClientRect(), old, gridScale);
  }, { passive: false });

  function applyAnchorZoom(cx, cy, rect, oldScale, newScale) {
    var fx = (cx - rect.left) / rect.width - 0.5;
    var fy = (cy - rect.top) / rect.height - 0.5;
    var dw = (newScale - oldScale) * (wrapInner.offsetWidth || rect.width);
    var dh = (newScale - oldScale) * (wrapInner.offsetHeight || rect.height);
    panX -= fx * dw;
    panY -= fy * dh;
    applyTransform();
  }

  // 移动端双指 pinch + 单指平移
  var pinchStartDist = 0;
  var pinchStartScale = 1;
  var pinchCenterX = 0, pinchCenterY = 0;
  var isPinching = false;
  var tStartPanX = 0, tStartPanY = 0;

  wrapOuter.addEventListener('touchstart', function (e) {
    touchMoved = false;
    if (e.touches.length >= 2) {
      var t1 = e.touches[0], t2 = e.touches[1];
      pinchStartDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
      pinchStartScale = gridScale;
      pinchCenterX = (t1.clientX + t2.clientX) / 2;
      pinchCenterY = (t1.clientY + t2.clientY) / 2;
      isPinching = true;
      isPanning = false;
      e.preventDefault();
    } else if (e.touches.length === 1) {
      if (!isPinching && gridScale > 1.01) {
        isPanning = true;
        lastTouchX = e.touches[0].clientX;
        lastTouchY = e.touches[0].clientY;
        tStartPanX = panX; tStartPanY = panY;
      }
    }
  }, { passive: false });

  wrapOuter.addEventListener('touchmove', function (e) {
    if (e.touches.length >= 2 && pinchStartDist > 0) {
      isPinching = true;
      var t1 = e.touches[0], t2 = e.touches[1];
      var d = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
      if (pinchStartDist <= 0) return;
      var ratio = d / pinchStartDist;
      var old = gridScale;
      gridScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, pinchStartScale * ratio));
      if (gridScale < 1.0) gridScale = 1.0;
      if (gridScale === 1.0) { resetPan(); applyTransform(); return; }
      applyAnchorZoom(pinchCenterX, pinchCenterY, wrapOuter.getBoundingClientRect(), old, gridScale);
      e.preventDefault();
      touchMoved = true;
    } else if (e.touches.length === 1 && isPanning) {
      var maxPanX = getMaxPan('x');
      var maxPanY = getMaxPan('y');
      var curX = e.touches[0].clientX;
      var curY = e.touches[0].clientY;
      var newPanX = tStartPanX + (curX - lastTouchX);
      var newPanY = tStartPanY + (curY - lastTouchY);
      panX = Math.max(-maxPanX, Math.min(maxPanX, newPanX));
      panY = Math.max(-maxPanY, Math.min(maxPanY, newPanY));
      applyTransform();
      if (Math.abs(curX - lastTouchX) > 2 || Math.abs(curY - lastTouchY) > 2) touchMoved = true;
      lastTouchX = curX;
      lastTouchY = curY;
      tStartPanX = panX; tStartPanY = panY;
      e.preventDefault();
    }
  }, { passive: false });

  wrapOuter.addEventListener('touchend', function (ev) {
    if (ev.touches.length === 0) {
      isPinching = false;
      pinchStartDist = 0;
      isPanning = false;
    } else if (ev.touches.length === 1 && gridScale > 1.01) {
      if (isPinching) { isPinching = false; pinchStartDist = 0; }
      isPanning = true;
      lastTouchX = ev.touches[0].clientX;
      lastTouchY = ev.touches[0].clientY;
      tStartPanX = panX; tStartPanY = panY;
    }
    if (touchMoved && ev.cancelable) { try { ev.preventDefault(); } catch (_) {} }
  });

  // 双击恢复
  var lastTap = 0;
  wrapOuter.addEventListener('touchend', function (e) {
    if (e.touches.length > 0) return;
    var now = Date.now();
    if ((now - lastTap < 300) && gridScale !== 1) {
      gridScale = 1; resetPan(); applyTransform();
      if (e.cancelable) { try { e.preventDefault(); } catch (_) {} }
    }
    lastTap = now;
  });
  wrapOuter.addEventListener('dblclick', function () {
    gridScale = 1; resetPan(); applyTransform();
  });

  /* ============== 鼠标拖拽平移：放大后支持拖动 ============== */
  var isMouseDragging = false;
  var mouseStartX = 0, mouseStartY = 0;
  var mousePanStartX = 0, mousePanStartY = 0;

  wrapOuter.addEventListener('mousedown', function (e) {
    if (gridScale <= 1) return;
    isMouseDragging = true;
    mouseStartX = e.clientX;
    mouseStartY = e.clientY;
    mousePanStartX = panX;
    mousePanStartY = panY;
    wrapOuter.style.cursor = 'grabbing';
    e.preventDefault();
  });

  document.addEventListener('mousemove', function (e) {
    if (!isMouseDragging) return;
    var dx = e.clientX - mouseStartX;
    var dy = e.clientY - mouseStartY;
    var maxPanX = getMaxPan('x');
    var maxPanY = getMaxPan('y');
    panX = Math.max(-maxPanX, Math.min(maxPanX, mousePanStartX + dx));
    panY = Math.max(-maxPanY, Math.min(maxPanY, mousePanStartY + dy));
    applyTransform();
  });

  document.addEventListener('mouseup', function () {
    isMouseDragging = false;
    wrapOuter.style.cursor = '';
  });

  wrapOuter.addEventListener('mouseleave', function () {
    if (!isMouseDragging && gridScale > 1) {
      wrapOuter.style.cursor = 'grab';
    }
  });
  wrapOuter.addEventListener('mouseenter', function () {
    if (!isMouseDragging && gridScale > 1) {
      wrapOuter.style.cursor = 'grab';
    }
  });

  function getMaxPan(axis) {
    var scaledW = (gridEl.offsetWidth || 0) * gridScale;
    var scaledH = (gridEl.offsetHeight || 0) * gridScale;
    var containerW = wrapOuter.clientWidth || 0;
    var containerH = wrapOuter.clientHeight || 0;
    if (axis === 'x') {
      return Math.max(0, (scaledW - containerW) / 2);
    } else {
      return Math.max(0, (scaledH - containerH) / 2);
    }
  }

})();
</script>
</body>
</html>
