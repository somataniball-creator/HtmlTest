<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PicCutter · 网格拼图</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f0f14;
  --surface:#1a1a24;
  --surface2:#252532;
  --border:#333344;
  --border-active:#4f8cff;
  --text:#f0f0f5;
  --text-dim:#8888a0;
  --accent:#4f8cff;
  --accent-hover:#3a78ee;
  --danger:#ef4444;
  --danger-hover:#dc2626;
  --cell-gap:0px;
  --outer-gap:0px;
  --cell-radius:0px;
  --gap-color:#1a1a24;
  --canvas-ratio:1;
  --toolbar-h:56px;
  --tabbar-h:230px;
  --tabbar-tab-h:42px;
}
html,body{width:100%;height:100%;overflow:hidden}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  height:100%;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
}

/* 顶部工具栏 */
.topbar{
  height:var(--toolbar-h);
  background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  flex-shrink:0;
}
.topbar-left{display:flex;align-items:center;gap:14px}
.topbar-right{display:flex;align-items:center;gap:8px}
.logo{font-size:1rem;font-weight:700;letter-spacing:.5px}
.logo span{color:var(--accent)}
.count-info{font-size:.8rem;color:var(--text-dim)}
.action-btn{
  padding:7px 14px;
  background:var(--accent);
  border:none;
  border-radius:8px;
  color:#fff;
  cursor:pointer;
  font-size:.85rem;
  font-weight:500;
  transition:all .15s;
}
.action-btn:hover{background:var(--accent-hover)}
.action-btn.danger{background:var(--surface2);border:1px solid var(--border);color:var(--text)}
.action-btn.danger:hover{border-color:var(--danger);color:var(--danger)}
.action-btn:disabled{opacity:.4;cursor:not-allowed}

/* 网格区域 */
.grid-wrap{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:10px;
  overflow:hidden;
  min-height:0;
  height:calc(100% - var(--toolbar-h) - var(--tabbar-h));
  position:relative;
}
.grid-wrap-inner{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  transform-origin:center center;
  will-change:transform;
}
.grid{
  display:grid;
  gap:var(--cell-gap);
  background:var(--gap-color);
  padding:var(--outer-gap);
  border-radius:0;
  border:1px solid var(--border);
  /* 尺寸由 JS 根据 --canvas-ratio + 容器尺寸显式计算，避免 CSS aspect-ratio 单轴约束问题 */
  min-width: 0;
  min-height: 0;
  flex-shrink:0;
}
/* 画布模板列/行：由 JS 的 buildGrid 同步注入列数，保证网格均分 W:H 比例 */
.grid[data-n="2"]{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr)}
.grid[data-n="3"]{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
.grid[data-n="4"]{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr)}
.cell{
  background:var(--surface2);
  position:relative;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  transition:all .15s;
  border-radius:var(--cell-radius);
}
.cell:hover{background-color:#2a2a38}
.cell.filled{
  border-radius:var(--cell-radius);
}
.cell.filled.selected{
  box-shadow:0 0 0 2px var(--accent),0 0 0 4px rgba(79,140,255,.3);
  z-index:2;
}
.cell .cell-img{
  position:absolute;
  left:-0.5px; top:-0.5px;
  width:calc(100% + 1px);
  height:calc(100% + 1px);
  background-color:transparent;
  background-repeat:no-repeat;
  background-position:center center;
  background-size:cover;
}
.cell.filled .placeholder{display:none}
.cell .placeholder{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--text-dim);
  font-size:.75rem;
  gap:4px;
  pointer-events:none;
  border:2px dashed var(--border);
  border-radius:8px;
  width:calc(100% - 8px);
  height:calc(100% - 8px);
  box-sizing:border-box;
}
.cell .placeholder svg{width:24px;height:24px;opacity:.6}
.cell .remove-btn{
  position:absolute;top:3px;right:3px;
  width:20px;height:20px;
  background:rgba(0,0,0,.6);
  border:none;border-radius:50%;
  color:#fff;cursor:pointer;
  display:none;align-items:center;justify-content:center;
  font-size:12px;line-height:1;padding:0;
}
.cell.filled:hover .remove-btn{display:flex}
.cell .remove-btn:hover{background:var(--danger)}
.cell .idx{
  position:absolute;bottom:4px;left:6px;
  font-size:.65rem;
  color:rgba(255,255,255,.5);
  background:rgba(0,0,0,.3);
  padding:1px 5px;border-radius:3px;
}

/* 底部选项栏 */
.tabbar{
  height:var(--tabbar-h);
  background:var(--surface);
  border-top:1px solid var(--border);
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.tabbar-tabs{
  display:flex;
  height:var(--tabbar-tab-h);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.tabbar-tab{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  background:none;
  border:none;
  border-bottom:2px solid transparent;
  color:var(--text-dim);
  cursor:pointer;
  font-size:.85rem;
  font-weight:600;
  letter-spacing:.5px;
  transition:all .15s;
}
.tabbar-tab.active{
  color:var(--text);
  border-bottom-color:var(--accent);
}
.tabbar-panel{
  flex:1;
  display:none;
  align-items:center;
  justify-content:center;
  padding:8px 14px 10px;
  overflow:hidden;
}
.tabbar-panel.active{display:flex}

.tabbar-row{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}
.tabbar-slider-val{
  font-size:.82rem;
  color:var(--text);
  font-weight:600;
  min-width:42px;
  text-align:right;
}

/* 相框样式 2x2 grid：一行 = 图标 + 滑块 + 数值 */
.frame-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px 14px;
  width:100%;
  max-width:640px;
  padding:2px 4px 8px;
}
.frame-slider,
.frame-color{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
  height:38px;
  padding:0 10px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
}
.frame-slider--wide{
  height:40px;
}
.panel-icon{
  flex-shrink:0;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:24px;height:24px;
  background:var(--surface2);
  border-radius:7px;
  color:var(--text-dim);
  line-height:1;
}
.panel-icon svg{width:16px;height:16px;display:block;}
.frame-range{
  flex:1;
  height:22px;
  -webkit-appearance:none;
  appearance:none;
  background:transparent;
  outline:none;
  cursor:pointer;
  min-width:0;
  touch-action: pan-x;
  -webkit-user-select:none;
  user-select:none;
}
.frame-range::-webkit-slider-runnable-track{
  height:8px;
  border-radius:4px;
  background:var(--surface2);
}
.frame-range::-moz-range-track{
  height:8px;
  border-radius:4px;
  background:var(--surface2);
  border:none;
}
.frame-range::-webkit-slider-thumb{
  -webkit-appearance:none;
  appearance:none;
  width:22px;height:22px;
  border-radius:50%;
  background:var(--accent);
  border:2px solid #fff;
  box-shadow:0 0 0 1px var(--border);
  cursor:pointer;
  margin-top:0;
}
.frame-range::-moz-range-thumb{
  width:22px;height:22px;
  border-radius:50%;
  background:var(--accent);
  border:2px solid #fff;
  box-shadow:0 0 0 1px var(--border);
  cursor:pointer;
}
.frame-color-body{
  display:flex;align-items:center;gap:6px;flex:1;min-width:0;
}
.tabbar-slider-val{
  flex-shrink:0;
  min-width:44px;
  text-align:right;
  font-size:.78rem;
  color:var(--text);
  font-variant-numeric: tabular-nums;
}

/* 间隙背景色 按钮 */
.gap-color-btn{
  width:22px;height:22px;
  border-radius:6px;
  border:2px solid #fff;
  box-shadow:0 0 0 1px var(--border);
  cursor:pointer;
  padding:0;
  line-height:1;
  flex-shrink:0;
}
.gap-color-btn[data-gap-color="#000000"]{background:#000}
.gap-color-btn[data-gap-color="#ffffff"]{background:#fff}
.gap-color-custom{
  position:relative;
  width:22px;height:22px;
  border-radius:6px;
  border:2px solid #fff;
  box-shadow:0 0 0 1px var(--border);
  background:conic-gradient(red, yellow, lime, aqua, blue, magenta, red);
  cursor:pointer;
  display:inline-block;
  padding:0;
  overflow:hidden;
  flex-shrink:0;
}
.gap-color-custom input[type=color]{
  position:absolute;inset:0;
  width:100%;height:100%;
  opacity:0;cursor:pointer;
  border:0;padding:0;margin:0;
}

.panel-label{font-size:.78rem;color:var(--text-dim);margin-right:4px}
.panel-btn{
  padding:7px 14px;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--text);
  cursor:pointer;
  font-size:.82rem;
  font-weight:600;
  transition:all .15s;
}
.panel-btn:hover{background:var(--border);border-color:var(--accent)}
.panel-btn.active{background:var(--accent);border-color:var(--accent)}
.placeholder-text{font-size:.8rem;color:var(--text-dim)}

/* 输出设置页签 */
.output-cols{
  display:flex;
  flex-direction:column;
  align-items:stretch;
  justify-content:flex-start;
  gap:10px;
  width:100%;
  max-width:560px;
  padding:2px 0;
}
.output-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  width:100%;
  flex-wrap:wrap;
}
.output-download{
  margin-top:2px;
  width:100%;
}
.output-tip{
  font-size:.7rem;
  color:var(--text-dim);
  text-align:center;
  line-height:1.4;
}

.hint{
  position:fixed;bottom:calc(var(--tabbar-h) + 8px);left:50%;transform:translateX(-50%);
  background:var(--surface);border:1px solid var(--border);
  padding:6px 14px;border-radius:8px;font-size:.75rem;color:var(--text-dim);
  pointer-events:none;z-index:10;
}

@media(max-width:600px){
  :root{--toolbar-h:48px;--tabbar-h:200px;--tabbar-tab-h:38px}
  .topbar{padding:0 10px}
  .topbar-left{gap:10px}
  .logo{font-size:.85rem}
  .action-btn{padding:6px 10px;font-size:.75rem}
  .count-info{font-size:.7rem}
  .grid-wrap{padding:6px}
  .cell .placeholder{font-size:.65rem}
  .cell .placeholder svg{width:18px;height:18px}
  .tabbar-tab{font-size:.72rem;letter-spacing:0;font-weight:500;padding:0 4px}
  .panel-btn{padding:6px 10px;font-size:.75rem}
  .panel-label{font-size:.7rem}
  .frame-grid{gap:8px 10px;padding:0 2px 4px}
  .frame-slider,.frame-color{height:34px;padding:0 8px;border-radius:9px;gap:6px}
  .frame-slider--wide{height:36px}
  .panel-icon{width:22px;height:22px;border-radius:6px}
  .panel-icon svg{width:15px;height:15px}
  .frame-range{height:20px}
  .frame-range::-webkit-slider-thumb{width:20px;height:20px}
  .frame-range::-webkit-slider-runnable-track{height:7px}
  .frame-range::-moz-range-thumb{width:20px;height:20px}
  .frame-range::-moz-range-track{height:7px}
  .tabbar-slider-val{font-size:.72rem;min-width:36px}
  .gap-color-btn,.gap-color-custom{width:20px;height:20px;border-radius:5px}
  .hint{font-size:.65rem;padding:5px 10px}
}
</style>
</head>
<body>

<!-- 顶部工具栏 -->
<div class="topbar">
  <div class="topbar-left">
    <div class="logo">Pic<span>Cutter</span><span style="color:var(--text-dim);font-size:.7rem;margin-left:6px;font-weight:400;letter-spacing:0">v2.1.1</span></div>
  </div>
  <div class="topbar-right">
    <button class="action-btn danger" id="clearBtn">清空</button>
  </div>
</div>

<!-- 网格区域 -->
<div class="grid-wrap">
  <div class="grid-wrap-inner" id="gridWrapInner">
    <div class="grid" id="grid"></div>
  </div>
</div>

<!-- 底部选项栏：三个页签 + 相框样式一行两个滑动条压缩空间 -->
<div class="tabbar">
  <div class="tabbar-tabs">
    <button class="tabbar-tab active" data-tab="layout">拼接方式</button>
    <button class="tabbar-tab" data-tab="frame">相框样式</button>
    <button class="tabbar-tab" data-tab="output">输出设置</button>
  </div>
  <div class="tabbar-panel active" data-panel="layout">
    <div class="tabbar-row" style="justify-content:center;width:100%">
      <span class="panel-label">网格</span>
      <button class="panel-btn" data-size="2">2×2</button>
      <button class="panel-btn active" data-size="3">3×3</button>
      <button class="panel-btn" data-size="4">4×4</button>
    </div>
  </div>
  <div class="tabbar-panel" data-panel="frame">
    <div class="frame-grid">
      <!-- 画布比例（第 1 行跨 2 列） -->
      <div class="frame-slider frame-slider--wide" style="grid-column:span 2">
        <span class="panel-icon" title="画布比例">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="14" height="14" rx="2"/>
            <path d="M17 5h4v14H7" opacity=".35"/>
            <path d="M17 5v14" stroke-dasharray="2 2"/>
            <path d="M3 19H17"/>
          </svg>
        </span>
        <input type="range" id="ratioRange" min="0" max="100" value="50" step="1" class="frame-range">
        <span id="ratioValue" class="tabbar-slider-val">1 : 1</span>
      </div>
      <!-- 图片之间间隙 -->
      <div class="frame-slider">
        <span class="panel-icon" title="图片之间间隙">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="7" height="16" rx="1"/>
            <rect x="14" y="4" width="7" height="16" rx="1"/>
            <path d="M10.5 8.5v7" stroke-dasharray="2 1.5" opacity=".7"/>
            <path d="M13.5 8.5v7" stroke-dasharray="2 1.5" opacity=".7"/>
          </svg>
        </span>
        <input type="range" id="cellGapRange" min="0" max="60" value="0" step="1" class="frame-range">
        <span id="cellGapValue" class="tabbar-slider-val">0 px</span>
      </div>
      <!-- 外边界间隙 -->
      <div class="frame-slider">
        <span class="panel-icon" title="外边界间隙">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <rect x="7" y="7" width="10" height="10" rx="1" opacity=".85"/>
            <path d="M3 12h4M17 12h4M12 3v4M12 17v4" opacity=".35"/>
          </svg>
        </span>
        <input type="range" id="outerGapRange" min="0" max="80" value="0" step="1" class="frame-range">
        <span id="outerGapValue" class="tabbar-slider-val">0 px</span>
      </div>
      <!-- 圆角 -->
      <div class="frame-slider">
        <span class="panel-icon" title="单张图片圆角">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 13V7a4 4 0 0 0-4-4h-6"/>
            <rect x="3" y="3" width="18" height="18" rx="3" opacity=".85"/>
            <path d="M4 13h6a3 3 0 0 1 3 3v4" opacity=".28"/>
          </svg>
        </span>
        <input type="range" id="radiusRange" min="0" max="60" value="0" step="1" class="frame-range">
        <span id="radiusValue" class="tabbar-slider-val">0 px</span>
      </div>
      <!-- 背景色 -->
      <div class="frame-color">
        <span class="panel-icon" title="间隙背景色">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22c-4.4 0-8-3.4-8-7.6C4 11 8 8 12 8s8 3 8 6.4C20 18.6 16.4 22 12 22z"/>
            <path d="M7 9l2.2-4.1c.5-1 1.8-1 2.3 0L13.5 9M5.5 15.5a2 2 0 1 0 0-4M18.5 15.5a2 2 0 1 0 0-4M12 18.5a2.3 2.3 0 1 0 0-4.6"/>
          </svg>
        </span>
        <div class="frame-color-body">
          <button type="button" data-gap-color="#000000" class="gap-color-btn" title="纯黑"></button>
          <button type="button" data-gap-color="#ffffff" class="gap-color-btn" title="纯白"></button>
          <label class="gap-color-custom" title="自定义颜色">
            <input type="color" id="gapColorPicker" value="#1a1a24">
          </label>
        </div>
        <span id="gapColorLabel" class="tabbar-slider-val">#1A1A24</span>
      </div>
    </div>
  </div>
  <div class="tabbar-panel" data-panel="output">
    <div class="output-cols">
      <div class="output-row">
        <span class="panel-label" style="margin:0">输出清晰度</span>
        <span id="qualityLabel" class="tabbar-slider-val" style="min-width:64px">高清</span>
      </div>
      <div class="output-row" style="gap:6px">
        <button type="button" class="quality-btn panel-btn" data-quality="2000" style="padding:5px 10px;font-size:.75rem">标准 2K</button>
        <button type="button" class="quality-btn panel-btn active" data-quality="2800" style="padding:5px 10px;font-size:.75rem">高清 2.8K</button>
        <button type="button" class="quality-btn panel-btn" data-quality="3600" style="padding:5px 10px;font-size:.75rem">超清 3.6K</button>
        <button type="button" class="quality-btn panel-btn" data-quality="0" style="padding:5px 10px;font-size:.75rem">原图级</button>
      </div>
      <div class="output-download">
        <button class="action-btn" id="downloadBtn" style="width:100%;justify-content:center;padding:10px 14px;font-size:.9rem" disabled>下载拼图</button>
      </div>
      <div class="output-tip">
        PNG 无损格式 · 高清为默认推荐档
      </div>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*" multiple style="display:none">
<div class="hint" id="hint">点击空格子添加图片 · 支持多选自动填充</div>

<script>
(function(){
  var gridEl=document.getElementById('grid');
  var fileInput=document.getElementById('fileInput');
  var clearBtn=document.getElementById('clearBtn');
  var downloadBtn=document.getElementById('downloadBtn');
  var hint=document.getElementById('hint');
  var currentSize=3;
  var selectedCellIdx=-1;
  var editingCell=-1;  // 当前被选中编辑的 cell index，-1=未选中
  var cells=[];
  // 每个 cell 的独立变换：{scale:1, ox:0, oy:0}，ox/oy 是在 cell 内部的偏移（单位：cell 宽高比例，-1~1）
  var cellTransforms=[];
  // 每个 cell 的原图尺寸（加载完成后）
  var cellsMeta=[];
  var currentCellGap = 0;   // 图片与图片之间
  var currentOuterGap = 0;  // 图片与外边界
  var currentRadius = 0;    // 单张图片圆角
  var currentGapColor = '#1a1a24';  // 间隙背景色（grid背景）
  var currentRatio = 1;     // 画布宽高比 W:H (0.5=1:2, 1=1:1, 2=2:1)
  var currentQuality = 2800; // 输出清晰度：0=原图级，>0=目标短边像素
  var cellGapRangeEl = null, cellGapValueEl = null;
  var outerGapRangeEl = null, outerGapValueEl = null;
  var radiusRangeEl = null, radiusValueEl = null;
  var gapColorPickerEl = null, gapColorLabelEl = null;
  var ratioRangeEl = null, ratioValueEl = null;
  var qualityLabelEl = null;

  function toHexColor(c){
    c = (c || '').trim().toLowerCase();
    if (!c) return '#1a1a24';
    // #RGB / #RRGGBB -> 统一 6 位大写
    if (/^#([0-9a-f]{3})$/.test(c)){
      var h = c.slice(1);
      c = '#' + h[0]+h[0] + h[1]+h[1] + h[2]+h[2];
    }
    if (/^#([0-9a-f]{6})$/.test(c)) return c;
    // 其他命名色 / rgb() 扔到临时节点读 computed
    try{
      var d = document.createElement('div');
      d.style.color = c;
      document.body.appendChild(d);
      var rgb = getComputedStyle(d).color;
      document.body.removeChild(d);
      var m = rgb.match(/rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/i);
      if (m){
        return '#' + [+m[1],+m[2],+m[3]].map(function(v){return ('0'+v.toString(16)).slice(-2)}).join('');
      }
    }catch(e){}
    return '#1a1a24';
  }
  function setCellGap(px){
    px = Math.max(0, Math.min(60, Math.floor(px)));
    currentCellGap = px;
    document.documentElement.style.setProperty('--cell-gap', px + 'px');
    if (cellGapValueEl) cellGapValueEl.textContent = px + ' px';
    if (cellGapRangeEl && +cellGapRangeEl.value !== px) cellGapRangeEl.value = String(px);
  }
  function setOuterGap(px){
    px = Math.max(0, Math.min(80, Math.floor(px)));
    currentOuterGap = px;
    document.documentElement.style.setProperty('--outer-gap', px + 'px');
    if (outerGapValueEl) outerGapValueEl.textContent = px + ' px';
    if (outerGapRangeEl && +outerGapRangeEl.value !== px) outerGapRangeEl.value = String(px);
  }
  function setRadius(px){
    px = Math.max(0, Math.min(60, Math.floor(px)));
    currentRadius = px;
    document.documentElement.style.setProperty('--cell-radius', px + 'px');
    if (radiusValueEl) radiusValueEl.textContent = px + ' px';
    if (radiusRangeEl && +radiusRangeEl.value !== px) radiusRangeEl.value = String(px);
  }
  function setGapColor(hexOrName, fromPicker){
    var hex = toHexColor(hexOrName);
    currentGapColor = hex;
    document.documentElement.style.setProperty('--gap-color', hex);
    if (gapColorLabelEl) gapColorLabelEl.textContent = hex.toUpperCase();
    if (!fromPicker && gapColorPickerEl) gapColorPickerEl.value = hex;
    document.querySelectorAll('.gap-color-btn').forEach(function(btn){
      var bc = toHexColor(btn.getAttribute('data-gap-color') || '');
      if (bc === hex) {
        btn.style.boxShadow = '0 0 0 2px var(--accent), 0 0 0 3px #fff';
      } else {
        btn.style.boxShadow = '0 0 0 1px var(--border)';
      }
    });
  }
  // 画布比例：滑块 0~100 → ratio 0.5~2，用几何插值保证 50=1:1 正中
  //   ratio = 2 ^ ((v-50)/50)  →  v=0 → 2^-1=0.5(1:2), v=50→1(1:1), v=100→2^1=2(2:1)
  function sliderToRatio(v){
    v = Math.max(0, Math.min(100, v - 0));
    var t = (v - 50) / 50;
    return Math.pow(2, t);
  }
  function ratioToSlider(r){
    r = Math.max(0.5, Math.min(2, r));
    var t = Math.log(r) / Math.log(2); // t ∈ [-1,1]
    return Math.round(50 + t * 50);
  }
  function formatRatioText(r){
    // 输出 W:H 文本，优先常见比例，否则 3 位小数近似
    r = Math.max(0.5, Math.min(2, r));
    function fmt(a,b){ return a + ' : ' + b; }
    function near(a,b){ return Math.abs(a-b) < 0.01; }
    if (near(r, 1))   return fmt(1,1);
    if (near(r, 0.5)) return fmt(1,2);
    if (near(r, 2))   return fmt(2,1);
    if (near(r, 2/3)) return fmt(2,3);
    if (near(r, 3/4)) return fmt(3,4);
    if (near(r, 3/2)) return fmt(3,2);
    if (near(r, 4/3)) return fmt(4,3);
    if (near(r, 5/4)) return fmt(5,4);
    if (near(r, 4/5)) return fmt(4,5);
    if (near(r, 9/16)) return fmt(9,16);
    if (near(r, 16/9)) return fmt(16,9);
    // 兜底：约成整数，比如 1.2 → 6:5
    var bestDiff = 1e9, bestA = 1, bestB = 1;
    for (var b = 1; b <= 20; b++){
      var a = Math.round(r * b);
      if (a < 1) a = 1;
      if (a > 40) continue;
      var diff = Math.abs(r - a/b);
      if (diff < bestDiff){ bestDiff = diff; bestA = a; bestB = b; }
    }
    return fmt(bestA, bestB);
  }
  function setRatio(v){
    var r;
    if (typeof v === 'number' && v <= 100) {
      // 传入滑块值 0~100
      r = sliderToRatio(v);
      if (ratioRangeEl && +ratioRangeEl.value !== v) ratioRangeEl.value = String(Math.round(v));
    } else {
      r = Math.max(0.5, Math.min(2, v || 1));
      var slider = ratioToSlider(r);
      if (ratioRangeEl && +ratioRangeEl.value !== slider) ratioRangeEl.value = String(slider);
    }
    currentRatio = r;
    document.documentElement.style.setProperty('--canvas-ratio', String(r));
    if (ratioValueEl) ratioValueEl.textContent = formatRatioText(r);
    // 比例变化后立即重算 grid 尺寸（contain 适配容器）
    try { fitGridToContainer(); } catch(_) {}
  }
  function setQuality(px){
    px = (px === 0 || px > 0) ? Math.floor(px) : 2800;
    if (px > 6000) px = 6000; // 安全上限：避免 4 亿+像素手机原图
    currentQuality = px;
    var label = '高清';
    if (px === 0) label = '原图级';
    else if (px <= 2000) label = '标准 2K';
    else if (px <= 2800) label = '高清';
    else label = '超清 3.6K';
    if (qualityLabelEl) { try { qualityLabelEl.textContent = label; } catch(_) {} }
    document.querySelectorAll('.quality-btn').forEach(function(btn){
      var bq = +btn.getAttribute('data-quality');
      try { btn.classList.toggle('active', bq === px); } catch(_) {}
    });
  }

  document.addEventListener('DOMContentLoaded', initGapControl, { once: true });
  function initGapControl(){
    try {
      cellGapRangeEl = document.getElementById('cellGapRange');
      cellGapValueEl = document.getElementById('cellGapValue');
      outerGapRangeEl = document.getElementById('outerGapRange');
      outerGapValueEl = document.getElementById('outerGapValue');
      radiusRangeEl = document.getElementById('radiusRange');
      radiusValueEl = document.getElementById('radiusValue');
      gapColorPickerEl = document.getElementById('gapColorPicker');
      gapColorLabelEl = document.getElementById('gapColorLabel');
      ratioRangeEl = document.getElementById('ratioRange');
      ratioValueEl = document.getElementById('ratioValue');
      qualityLabelEl = document.getElementById('qualityLabel');
      if (cellGapRangeEl) cellGapRangeEl.addEventListener('input', function(){ setCellGap(+this.value); });
      if (outerGapRangeEl) outerGapRangeEl.addEventListener('input', function(){ setOuterGap(+this.value); });
      if (radiusRangeEl) radiusRangeEl.addEventListener('input', function(){ setRadius(+this.value); });
      if (ratioRangeEl)  ratioRangeEl.addEventListener('input', function(){ setRatio(+this.value); });
      if (gapColorPickerEl) gapColorPickerEl.addEventListener('input', function(){ setGapColor(this.value, true); });
      document.querySelectorAll('.gap-color-btn').forEach(function(btn){
        btn.addEventListener('click', function(){ setGapColor(this.getAttribute('data-gap-color') || '#1a1a24'); });
      });
      document.querySelectorAll('.quality-btn').forEach(function(btn){
        btn.addEventListener('click', function(){ setQuality(+this.getAttribute('data-quality') || 2800); });
      });
      setCellGap(0);
      setOuterGap(0);
      setRadius(0);
      setRatio(50);  // 滑块默认 50 → 比例 1:1
      setGapColor('#1a1a24');
      setQuality(2800);
    } catch (e) {
      try { console.warn('[PicCutter] initGapControl:', e && e.message); } catch(_) {}
    }
  }
  if (document.readyState === 'complete' || document.readyState === 'interactive'){
    setTimeout(initGapControl, 0);
  }

  // 长按菜单 & 状态
  var LONG_PRESS_MS = 550;
  var longPressTimer = null;
  var longPressIdx = -1;
  var longPressTriggered = false;
  var lpStartX = 0, lpStartY = 0;
  var cellActionMenu = null;
  var menuAnchorCell = null;   // 当前菜单归属的格子（点这个格子不关闭）
  var menuClicked = false;     // 本次按下是否命中菜单项

  function clearLongPressTimer(){
    if (longPressTimer){ clearTimeout(longPressTimer); longPressTimer = null; }
  }
  function closeCellMenu(){
    if (cellActionMenu && cellActionMenu.parentNode){ cellActionMenu.parentNode.removeChild(cellActionMenu); }
    cellActionMenu = null;
    menuAnchorCell = null;
  }
  function isInMenuOrAnchor(target){
    if (!target) return false;
    if (menuAnchorCell && menuAnchorCell.contains(target)) return true;
    if (cellActionMenu && cellActionMenu.contains(target)) return true;
    return false;
  }
  // 唯一关闭入口：按下时（鼠标/触摸）命中「既不在菜单也不在原格子」才关
  document.addEventListener('pointerdown', function(e){
    if (!cellActionMenu) return;
    if (isInMenuOrAnchor(e.target)) return;
    closeCellMenu();
  }, true);
  document.addEventListener('touchstart', function(e){
    if (!cellActionMenu) return;
    var t = e.target;
    if (t && isInMenuOrAnchor(t)) return;
    closeCellMenu();
  }, { passive: true, capture: true });
  // Esc 键也关闭
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') closeCellMenu();
  });

  function openCellMenu(cellEl, idx){
    closeCellMenu();
    menuAnchorCell = cellEl;
    var rect = cellEl.getBoundingClientRect();
    var menu = document.createElement('div');
    menu.style.cssText = 'position:fixed;z-index:9999;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:6px;min-width:140px;box-shadow:0 10px 30px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:2px;';
    function showMenuAt(){
      var w = window.innerWidth, h = window.innerHeight;
      var mw = menu.offsetWidth, mh = menu.offsetHeight;
      var top = rect.bottom + 6;
      var left = rect.left + rect.width/2 - mw/2;
      if (top + mh > h - 8) { top = Math.max(8, rect.top - mh - 6); }
      if (left < 8) left = 8;
      if (left + mw > w - 8) left = Math.max(8, w - mw - 8);
      menu.style.top = top + 'px';
      menu.style.left = left + 'px';
    }
    function item(label, onClick, danger){
      var btn = document.createElement('button');
      btn.textContent = label;
      btn.style.cssText = 'display:block;width:100%;background:none;border:none;text-align:left;padding:9px 12px;border-radius:6px;color:'+(danger?'var(--danger)':'var(--text)')+';font-size:.9rem;cursor:pointer;font-weight:500;white-space:nowrap;';
      btn.addEventListener('mouseenter', function(){ btn.style.background = 'var(--surface2)'; });
      btn.addEventListener('mouseleave', function(){ btn.style.background = 'none'; });
      btn.addEventListener('click', function(){ closeCellMenu(); setTimeout(onClick, 0); });
      btn.addEventListener('touchend', function(e){ e.preventDefault(); closeCellMenu(); setTimeout(onClick, 0); }, { passive: false });
      return btn;
    }
    menu.appendChild(item('替换图片', function(){
      selectedCellIdx = idx;
      fileInput.value = '';
      fileInput.setAttribute('data-replace', '1');
      fileInput.click();
    }));
    menu.appendChild(item('移除图片', function(){
      if (confirm('确定移除这张图片？')) { cells[idx] = null; render(); updateCount(); }
    }, true));
    document.body.appendChild(menu);
    requestAnimationFrame(function(){
      showMenuAt();
      cellActionMenu = menu;
    });
    window.addEventListener('resize', showMenuAt, { once: true });
  }

  function buildGrid(n){
    currentSize=n;
    var total=n*n;
    var old=cells.slice();
    cells=[];
    for(var i=0;i<total;i++){cells.push(old[i]||null);}
    if (gridEl) gridEl.setAttribute('data-n', String(n));
    render();
    updateCount();
  }

  function render(){
    var n=currentSize;
    gridEl.setAttribute('data-n', String(n));
    gridEl.style.gridTemplateColumns='repeat('+n+',1fr)';
    gridEl.style.gridTemplateRows='repeat('+n+',1fr)';
    gridEl.innerHTML='';
    // 确保 cellTransforms 数组对齐 cells 长度
    while (cellTransforms.length < cells.length) {
      cellTransforms.push({scale:1, ox:0, oy:0});
    }
    for(var i=0;i<cells.length;i++){
      var cell=document.createElement('div');
      var filled = !!cells[i];
      cell.className='cell'+(filled?' filled':'')+(editingCell===i?' selected':'');
      cell.dataset.idx=i;
      if(filled){
        var img=document.createElement('div');
        img.className='cell-img';
        img.style.backgroundImage='url('+cells[i]+')';
        cell.appendChild(img);
        cell.innerHTML+='<span class="idx">'+(i+1)+'</span>';
        bindCellLongPress(cell, i, true);
      }else{
        cell.innerHTML='<div class="placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8M8 12h8"/></svg><span>点击添加</span></div><span class="idx">'+(i+1)+'</span>';
        bindCellLongPress(cell, i, false);
      }
      cell.addEventListener('click',onCellClick);
      gridEl.appendChild(cell);
      // 应用已存储的变换
      if (filled) applyCellTransform(i, cell);
    }
    fitGridToContainer();
  }

  function applyCellTransform(idx, cellEl){
    var t = cellTransforms[idx] || {scale:1, ox:0, oy:0};
    var m = cellsMeta[idx];
    var imgEl = cellEl ? cellEl.querySelector('.cell-img') : null;
    if (!imgEl) return;
    if (!m || !m.iw || !m.ih) {
      var tmpImg = new Image();
      tmpImg.onload = function(){
        cellsMeta[idx] = {iw: tmpImg.naturalWidth || 800, ih: tmpImg.naturalHeight || 800};
        applyCellTransform(idx, cellEl);
      };
      tmpImg.onerror = function(){
        cellsMeta[idx] = {iw: 800, ih: 800};
        applyCellTransform(idx, cellEl);
      };
      tmpImg.src = cells[idx];
      return;
    }
    // 用 getBoundingClientRect 取亚像素精确值，避免 clientWidth 的整数截断
    var rect = cellEl.getBoundingClientRect();
    var cellW = rect.width || cellEl.clientWidth || 0;
    var cellH = rect.height || cellEl.clientHeight || 0;
    var scale = Math.max(0.1, Math.min(5, t.scale));
    var baseScale = (cellW>0 && cellH>0) ? Math.max(cellW / m.iw, cellH / m.ih) : 1;
    var totalScale = baseScale * scale;
    // 用 Math.ceil 向上取整，避免亚像素偏差导致背景图比容器小 1px 出现裁切
    var bgW = Math.max(1, Math.ceil(m.iw * totalScale));
    var bgH = Math.max(1, Math.ceil(m.ih * totalScale));
    // 计算允许的最大像素偏移：保证图片始终覆盖 cell（放大后）或留在 cell 内（缩小时）
    var maxOffX = Math.max(0, (bgW - cellW) / 2);
    var maxOffY = Math.max(0, (bgH - cellH) / 2);
    var offX = t.ox * cellW;
    var offY = t.oy * cellH;
    offX = Math.max(-maxOffX, Math.min(maxOffX, offX));
    offY = Math.max(-maxOffY, Math.min(maxOffY, offY));
    // 同步回写夹取后的 ox/oy（比例值）
    t.ox = cellW > 0 ? offX / cellW : 0;
    t.oy = cellH > 0 ? offY / cellH : 0;
    cellTransforms[idx] = t;
    // 用 floor+ceil 代替 Math.round，确保居中时不会因为 0.5px 向下取整导致另一边少 1px
    var baseX = Math.floor((cellW - bgW) / 2);
    var baseY = Math.floor((cellH - bgH) / 2);
    imgEl.style.backgroundSize = bgW + 'px ' + bgH + 'px';
    imgEl.style.backgroundPosition = baseX + 'px ' + baseY + 'px';
    imgEl.style.transform = 'translate(' + offX + 'px,' + offY + 'px)';
  }

  function updateCellTransform(idx, scale, ox, oy){
    var t = cellTransforms[idx] || {scale:1, ox:0, oy:0};
    t.scale = Math.max(0.1, Math.min(5, scale));
    t.ox = Math.max(-1, Math.min(1, ox));
    t.oy = Math.max(-1, Math.min(1, oy));
    cellTransforms[idx] = t;
    var cellEl = gridEl.querySelector('.cell[data-idx="' + idx + '"]');
    if (cellEl) applyCellTransform(idx, cellEl);
  }

  function setEditingCell(idx){
    var old = editingCell;
    editingCell = idx;
    // 更新 DOM selected 状态
    var oldEl = old >= 0 ? gridEl.querySelector('.cell[data-idx="' + old + '"]') : null;
    if (oldEl) oldEl.classList.remove('selected');
    var newEl = idx >= 0 ? gridEl.querySelector('.cell[data-idx="' + idx + '"]') : null;
    if (newEl) newEl.classList.add('selected');
    updateHint();
  }

  function updateHint(){
    if (!hint) return;
    if (editingCell >= 0) {
      var t = cellTransforms[editingCell] || {scale:1, ox:0, oy:0};
      hint.textContent = '单图编辑中 · 滚轮缩放 · 拖拽移动 · 再点击取消  (缩放:' + t.scale.toFixed(2) + ')';
      hint.style.display = 'block';
    } else if (cells.filter(Boolean).length > 0) {
      hint.textContent = '点击已填图片可编辑 · 整图滚轮缩放/拖拽平移';
      hint.style.display = 'block';
    } else {
      hint.textContent = '点击空格子添加图片 · 支持多选自动填充';
      hint.style.display = 'block';
    }
  }

  // 根据当前画布比例 + 容器可用尺寸，用"contain"规则算出 grid 的实际宽高
  function fitGridToContainer(){
    if (!gridEl) return;
    var wrap = document.getElementById('gridWrapInner');
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var contW = Math.max(1, rect.width - 20);
    var contH = Math.max(1, rect.height - 20);
    var ratio = Math.max(0.5, Math.min(2, currentRatio || 1));
    var gw, gh;
    if (contW / contH >= ratio) {
      gh = contH;
      gw = gh * ratio;
      if (gw > contW) { gw = contW; gh = gw / ratio; }
    } else {
      gw = contW;
      gh = gw / ratio;
      if (gh > contH) { gh = contH; gw = gh * ratio; }
    }
    gw = Math.max(1, Math.round(gw));
    gh = Math.max(1, Math.round(gh));
    var sizeChanged = !gridEl.style.width || (+gridEl.style.width.replace('px','') !== gw) || (+(gridEl.style.height||'').replace('px','') !== gh);
    gridEl.style.width = gw + 'px';
    gridEl.style.height = gh + 'px';
    gridScale = 1;
    panX = 0;
    panY = 0;
    try { applyTransform(); } catch(_) {}
    // cell 尺寸变了，重新计算每张图的背景尺寸/位置
    if (sizeChanged) {
      for (var i=0;i<cells.length;i++){
        if (!cells[i]) continue;
        var ce = gridEl.querySelector('.cell[data-idx="'+i+'"]');
        if (ce) applyCellTransform(i, ce);
      }
    }
  }

  function bindCellLongPress(cell, idx, isFilled){
    // 桌面端：右键
    cell.addEventListener('contextmenu', function(e){
      e.preventDefault();
      if (isFilled) openCellMenu(cell, idx);
    });
    // 通用：mousedown / touchstart 长按计时
    cell.addEventListener('mousedown', function(e){
      if (!isFilled) return;
      if (e.button !== 0) return;
      startLongPress(e.clientX, e.clientY, cell, idx);
    });
    cell.addEventListener('mouseup', clearLongPressTimer);
    cell.addEventListener('mouseleave', clearLongPressTimer);
    cell.addEventListener('mousemove', function(e){
      if (Math.abs(e.clientX - lpStartX) > 8 || Math.abs(e.clientY - lpStartY) > 8) clearLongPressTimer();
    });

    cell.addEventListener('touchstart', function(e){
      if (!isFilled) return;
      var t = e.touches[0];
      startLongPress(t.clientX, t.clientY, cell, idx);
    }, { passive: true });
    cell.addEventListener('touchend', function(e){
      if (longPressTriggered) { e.preventDefault(); }
      clearLongPressTimer();
    });
    cell.addEventListener('touchmove', function(e){
      var t = e.touches[0];
      if (Math.abs(t.clientX - lpStartX) > 8 || Math.abs(t.clientY - lpStartY) > 8) clearLongPressTimer();
    }, { passive: true });
    cell.addEventListener('touchcancel', clearLongPressTimer);
  }

  function startLongPress(x, y, cell, idx){
    longPressIdx = idx;
    longPressTriggered = false;
    lpStartX = x;
    lpStartY = y;
    clearLongPressTimer();
    longPressTimer = setTimeout(function(){
      longPressTriggered = true;
      if (navigator.vibrate) { try { navigator.vibrate(20); } catch(_) {} }
      openCellMenu(cell, idx);
    }, LONG_PRESS_MS);
  }

  function onCellClick(e){
    e.stopPropagation();
    var idx=parseInt(this.dataset.idx);
    if (longPressTriggered) { longPressTriggered = false; return; }
    if(cells[idx]){
      // 已填图：切换选中/取消选中
      if (editingCell === idx) {
        setEditingCell(-1);
      } else {
        setEditingCell(idx);
      }
      return;
    }
    // 空格子：点击添加图片
    setEditingCell(-1);
    selectedCellIdx=idx;
    fileInput.value='';
    fileInput.removeAttribute('data-replace');
    fileInput.click();
  }

  function updateCount(){
    var filled=cells.filter(Boolean).length;
    var total=cells.length;
    if (downloadBtn) downloadBtn.disabled = (filled === 0);
    if (hint) hint.style.display = filled > 0 ? 'none' : 'block';
  }

  function loadImageIntoCell(targetCell, file){
    var reader=new FileReader();
    reader.onload=function(ev){
      cells[targetCell]=ev.target.result;
      // 保存图片原始 iw/ih 用于后续计算
      var probe=new Image();
      probe.onload=function(){
        cellsMeta[targetCell] = {iw: probe.naturalWidth, ih: probe.naturalHeight};
        cellTransforms[targetCell] = cellTransforms[targetCell] || {scale:1,ox:0,oy:0};
        render();
        updateCount();
      };
      probe.onerror=function(){
        cellsMeta[targetCell] = {iw: 800, ih: 800};
        cellTransforms[targetCell] = cellTransforms[targetCell] || {scale:1,ox:0,oy:0};
        render();
        updateCount();
      };
      probe.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  fileInput.addEventListener('change',function(e){
    var files=Array.from(e.target.files);
    if(!files.length)return;
    var n=currentSize*currentSize;
    var isReplace = fileInput.hasAttribute('data-replace');
    fileInput.removeAttribute('data-replace');
    var idx=selectedCellIdx>=0?selectedCellIdx:0;
    if(!isReplace && cells[idx]){
      var firstEmpty = cells.findIndex(function(c){return !c});
      if (firstEmpty >= 0) idx = firstEmpty;
    }
    var fileIdx=0;
    if (isReplace && selectedCellIdx >= 0) {
      var targetCell = selectedCellIdx;
      var firstFile = files[0];
      // 重置目标格的变换
      cellTransforms[targetCell] = {scale:1,ox:0,oy:0};
      loadImageIntoCell(targetCell, firstFile);
      selectedCellIdx=-1;
      return;
    }
    for(var i=idx;i<n && fileIdx<files.length;i++){
      if(cells[i])continue;
      cellTransforms[i] = {scale:1,ox:0,oy:0};
      loadImageIntoCell(i, files[fileIdx++]);
    }
    selectedCellIdx=-1;
  });

  clearBtn.addEventListener('click',function(){
    if(!cells.some(Boolean))return;
    if(!confirm('确定清空所有图片？'))return;
    cells=cells.map(function(){return null});
    cellTransforms=[];
    cellsMeta=[];
    editingCell=-1;
    render();updateCount();
  });

  // Tab 切换（拼接方式 / 相框样式）
  document.querySelectorAll('.tabbar-tab').forEach(function(tab){
    tab.addEventListener('click',function(){

  // 下载 / 保存
  downloadBtn.addEventListener('click', downloadCollage);

  var isMobile = /iPhone|iPad|iPod|Android|Mobile/i.test(navigator.userAgent);

  function downloadCollage(){
    var filled = cells.map(function(c, i){return c ? i : -1}).filter(function(i){return i >= 0});
    if (!filled.length) { alert('请先添加图片'); return; }
    downloadBtn.disabled = true;

    var tasks = filled.map(function(idx){
      return new Promise(function(resolve){
        var img = new Image();
        img.onload = function(){ resolve({ img: img, idx: idx }); };
        img.onerror = function(){ resolve({ img: null, idx: idx }); };
        img.src = cells[idx];
      });
    });

    Promise.all(tasks).then(function(results){
      var n = currentSize;
      var ratio = Math.max(0.5, Math.min(2, currentRatio || 1)); // W:H, 0.5~2
      var cellGapCss = Math.max(0, Math.min(60, Math.floor(currentCellGap)));
      var outerGapCss = Math.max(0, Math.min(80, Math.floor(currentOuterGap)));
      var radiusCss = Math.max(0, Math.min(60, Math.floor(currentRadius)));
      var gapColorCss = toHexColor(currentGapColor || '#1a1a24');
      var quality = (currentQuality > 6000) ? 6000 : (currentQuality >= 0 ? currentQuality : 2800);

      // 1. 确定基准尺寸：shortSide = 短边 = quality 目标像素
      //    quality>0 → shortSide = quality;
      //    quality=0 原图级 → 按"cover 需要的短边像素最大"推导 shortSide = maxCellPx，保证不小于原图
      var shortSide;
      if (quality > 0) {
        shortSide = quality;
      } else {
        var maxCellPx = 0;
        results.forEach(function(r){
          if (r && r.img && r.img.naturalWidth>0 && r.img.naturalHeight>0) {
            // cover 下：目标 cellW × cellH 中要求原图至少 min(imgW, min(imgH × cellW/cellH, ...)) 的最小值等于 max( min(imgW,imgH*(cellW/cellH)), min(imgW*(cellH/cellW), imgH) )
            // 简化：取 min(图宽, 图高) 为"至少需要的像素"，再乘以 shortSide 方向
            var s = Math.min(r.img.naturalWidth, r.img.naturalHeight);
            if (s > maxCellPx) maxCellPx = s;
          }
        });
        if (maxCellPx < 1) maxCellPx = 2000;
        shortSide = Math.min(6000, maxCellPx);
      }

      // 2. 根据 W:H 比例算实际画布宽高：短边=shortSide，长边按比例延伸
      var outW, outH;
      if (ratio >= 1) {
        // 横屏或方形：短边 = 高度
        outH = shortSide;
        outW = Math.max(1, Math.round(shortSide * ratio));
      } else {
        // 竖屏：短边 = 宽度
        outW = shortSide;
        outH = Math.max(1, Math.round(shortSide / ratio));
      }

      // 3. 预览端 → 画布端 比例换算：沿用 v2.1.0 稳定版的 kAvg 几何平均，保证整体视觉一致
      var gridRect = null;
      try { gridRect = gridEl.getBoundingClientRect ? gridEl.getBoundingClientRect() : null; } catch(_) {}
      var previewW = Math.max(1, Math.round(gridRect ? (gridRect.width || 0) : 0));
      var previewH = Math.max(1, Math.round(gridRect ? (gridRect.height || 0) : 0));
      var scaleX = outW / previewW;
      var scaleY = outH / previewH;
      var kAvg = Math.sqrt(scaleX * scaleY);
      var cellGap = Math.max(0, Math.round(cellGapCss * kAvg));
      var outerGap = Math.max(0, Math.round(outerGapCss * kAvg));

      // 4. canvas cellW/cellH：把画布扣除 gap/outer 剩余的空间 n 等分（v2.1.0 稳定算法），保证整张图无缝贴合
      var cellW = Math.max(1, Math.floor((outW - 2*outerGap - (n-1)*cellGap) / n));
      var cellH = Math.max(1, Math.floor((outH - 2*outerGap - (n-1)*cellGap) / n));
      outW = 2*outerGap + n*cellW + (n-1)*cellGap;
      outH = 2*outerGap + n*cellH + (n-1)*cellGap;

      // 为单图变换准备的"真实预览 cell 尺寸"（用于与 canvas cell 实际缩放比 kx/ky 对齐）
      var gridBorderPx = 1;
      var pxContW = Math.max(1, previewW - 2*gridBorderPx - 2*outerGapCss);
      var pxContH = Math.max(1, previewH - 2*gridBorderPx - 2*outerGapCss);
      var previewCellW = Math.max(1, (pxContW - (n-1)*cellGapCss) / n);
      var previewCellH = Math.max(1, (pxContH - (n-1)*cellGapCss) / n);

      // 圆角半径：按预览 cell 的宽/高比（哪个短）换算，保证圆角视觉一致
      var kx = cellW / Math.max(1, previewCellW);
      var ky = cellH / Math.max(1, previewCellH);
      var kMin = Math.min(kx, ky);
      var radiusPx = Math.max(0, Math.round(radiusCss * kMin));
      var r = Math.min(radiusPx, Math.floor(cellW/2), Math.floor(cellH/2));

      var canvas = document.createElement('canvas');
      canvas.width = outW; canvas.height = outH;
      var ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';

      function roundRectPath(x, y, w, h, rr){
        rr = Math.min(rr, Math.floor(w/2), Math.floor(h/2));
        ctx.beginPath();
        if (rr <= 0){
          ctx.rect(x, y, w, h);
          return;
        }
        ctx.moveTo(x + rr, y);
        ctx.lineTo(x + w - rr, y);
        ctx.arcTo(x + w, y, x + w, y + rr, rr);
        ctx.lineTo(x + w, y + h - rr);
        ctx.arcTo(x + w, y + h, x + w - rr, y + h, rr);
        ctx.lineTo(x + rr, y + h);
        ctx.arcTo(x, y + h, x, y + h - rr, rr);
        ctx.lineTo(x, y + rr);
        ctx.arcTo(x, y, x + rr, y, rr);
        ctx.closePath();
      }

      // 第 1 层：整个画布填间隙背景色（用户选的黑/白/自定义）
      ctx.fillStyle = gapColorCss;
      ctx.fillRect(0, 0, outW, outH);

      for (var i = 0; i < n * n; i++){
        var col = i % n, row = Math.floor(i / n);
        var x = outerGap + col * (cellW + cellGap);
        var y = outerGap + row * (cellH + cellGap);
        var found = results.find(function(rr){ return rr.idx === i; });
        var hasImg = !!(cells[i] && found && found.img && found.img.complete && found.img.naturalWidth>0);

        // 第 2 层：cell 底色圆角填充（--surface2）
        ctx.save();
        roundRectPath(x, y, cellW, cellH, r);
        ctx.fillStyle = '#252532';
        ctx.fill();
        ctx.restore();

        // 第 3 层：图片 cover 绘制 + 单图变换（边界夹取，保证与预览端完全一致）
        if (hasImg){
          ctx.save();
          roundRectPath(x, y, cellW, cellH, r);
          ctx.clip();
          var img = found.img;
          var iw = img.naturalWidth, ih = img.naturalHeight;
          var ct = cellTransforms[i] || {scale:1, ox:0, oy:0};
          var pW = Math.max(1, previewCellW);
          var pH = Math.max(1, previewCellH);
          var kx = cellW / pW;
          var ky = cellH / pH;
          var baseScalePrev = Math.max(pW / iw, pH / ih);
          var total = baseScalePrev * Math.max(0.1, Math.min(5, ct.scale));
          var dw = Math.max(1, Math.round(iw * total * kx));
          var dh = Math.max(1, Math.round(ih * total * ky));
          // 夹取偏移，保证图片始终覆盖 cell 或留在 cell 内
          var maxOffX = Math.max(0, Math.abs(dw - cellW) / 2);
          var maxOffY = Math.max(0, Math.abs(dh - cellH) / 2);
          var offX = Math.round(ct.ox * cellW);
          var offY = Math.round(ct.oy * cellH);
          offX = Math.max(-maxOffX, Math.min(maxOffX, offX));
          offY = Math.max(-maxOffY, Math.min(maxOffY, offY));
          var baseX = Math.round(x + (cellW - dw) / 2);
          var baseY = Math.round(y + (cellH - dh) / 2);
          var dx = Math.round(baseX + offX);
          var dy = Math.round(baseY + offY);
          ctx.drawImage(img, dx, dy, dw, dh);
          ctx.restore();
        }
      }

      canvas.toBlob(function(blob){
        if (!blob) { downloadBtn.disabled = false; return; }
        var url = URL.createObjectURL(blob);
        var tag = [];
        if (cellGapCss>0) tag.push('c'+cellGapCss);
        if (outerGapCss>0) tag.push('o'+outerGapCss);
        if (radiusCss>0)  tag.push('r'+radiusCss);
        var hx = gapColorCss.replace('#','').toUpperCase();
        if (hx === '000000') tag.push('bgBLACK');
        else if (hx === 'FFFFFF') tag.push('bgWHITE');
        else tag.push('bg'+hx);
        var qTag;
        if (quality === 0) qTag = 'qORIGINAL';
        else if (quality <= 2000) qTag = 'q2K';
        else if (quality <= 2800) qTag = 'q2_8K';
        else qTag = 'q3_6K';
        // 比例 tag：ratio 用 formatRatioText 输出紧凑版 aXb（如 1x2 / 1x1 / 2x1 / 4x3 ...）
        var ratioText = formatRatioText(ratio).replace(/\s*/g,'').replace(/:/g,'x');
        var ratioTag = 'ratio' + ratioText;
        tag.push(ratioTag);
        tag.push(qTag);
        var tagStr = tag.length ? ('_' + tag.join('_')) : '';
        var fileName = 'piccutter_' + n + 'x' + n + tagStr + '.png';

        if (isMobile){
          // iPhone：优先调系统分享面板（里面有"存储图像"），同时展示预览+手动保存备选
          var file = new File([blob], fileName, { type: 'image/png' });
          var canShare = !!(navigator.share && navigator.canShare && navigator.canShare({ files: [file] }));
          if (canShare) {
            navigator.share({
              title: 'PicCutter 拼图',
              text: fileName,
              files: [file]
            }).then(function(){
              downloadBtn.disabled = false;
              setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
            }).catch(function(){
              // 用户取消或分享失败，兜底展示预览 overlay
              showSaveOverlay(url, blob, fileName);
            });
          } else {
            // 不支持文件分享，展示预览 overlay
            showSaveOverlay(url, blob, fileName);
          }
        } else {
          // 桌面端：直接下载
          var a = document.createElement('a');
          a.href = url;
          a.setAttribute('download', fileName);
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function(){ URL.revokeObjectURL(url); downloadBtn.disabled = false; }, 2000);
        }
      }, 'image/png', 1.0);
    });
  }

  // 移动端保存到相册的 overlay（备选：支持直接调系统分享 + 长按保存）
  function showSaveOverlay(imgUrl, blob, fileName){
    var overlay = document.createElement('div');
    overlay.id = 'saveOverlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;';

    tip.style.cssText = 'color:var(--text-dim);font-size:.8rem;margin-bottom:16px;text-align:center;';

    previewImg.src = imgUrl;

    var shareBtn = document.createElement('button');
    shareBtn.textContent = '分享/保存到相册';
    shareBtn.style.cssText = 'padding:11px 24px;background:var(--accent);border:none;border-radius:8px;color:#fff;font-size:.95rem;font-weight:500;cursor:pointer;';

    var longPressBtn = document.createElement('button');
    longPressBtn.textContent = '长按保存';
    longPressBtn.style.cssText = 'padding:11px 20px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:8px;color:#fff;font-size:.9rem;cursor:pointer;';

    var closeBtn = document.createElement('button');
    closeBtn.textContent = '关闭';
    closeBtn.style.cssText = 'padding:11px 20px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);border-radius:8px;color:var(--text-dim);font-size:.9rem;cursor:pointer;';

    var closeOverlay = function(){

      URL.revokeObjectURL(imgUrl);

    };

    shareBtn.addEventListener('click', function(){
      if (blob && navigator.share && navigator.canShare) {

          navigator.share({ files: [f], title: 'PicCutter 拼图' }).catch(function(){});
          return;
        }
      }
      // share 不可用时，提示长按图片
      alert('当前浏览器不支持分享，请长按上方图片保存');
    });

    longPressBtn.addEventListener('click', function(){
      tip.textContent = '请长按上方图片 → 在弹出菜单中选择"添加到照片"';

    overlay.appendChild(tip);

    document.body.appendChild(overlay);

  buildGrid(3);
  // 窗口尺寸变化时重新适配画布（contain 规则）
  window.addEventListener('resize', function(){
    try { fitGridToContainer(); } catch(_) {}
  });
  // 初始化完成后再执行一次，防止 DOMContentLoaded 时容器还没布局
  if (document.readyState === 'complete') {
    setTimeout(function(){ try { fitGridToContainer(); } catch(_) {} }, 50);
  }

  /* ============== 网格缩放：滚轮 + 双指 pinch，以区域中心为锚点 ============== */
  var wrapInner = document.getElementById('gridWrapInner');
  var wrapOuter = wrapInner.parentElement;
  var gridScale = 1;
  var MIN_SCALE = 0.5;
  var MAX_SCALE = 5.0;
  var panX = 0, panY = 0;
  var isPanning = false;
  var panStartX = 0, panStartY = 0;
  var touchMoved = false;
  var lastTouchX = 0, lastTouchY = 0;

  function applyTransform() {
    wrapInner.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + gridScale + ')';
  }
  function resetPan() { panX = 0; panY = 0; }

  // PC 滚轮缩放（仅在未选中 cell 时生效）
  wrapOuter.addEventListener('wheel', function (e) {
    if (editingCell >= 0) return;
    e.preventDefault();
    var delta = -e.deltaY * 0.0025;
    var old = gridScale;
    gridScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, gridScale + delta));
    if (gridScale <= 1.0) { gridScale = 1; resetPan(); applyTransform(); return; }
    applyAnchorZoom(e.clientX, e.clientY, wrapOuter.getBoundingClientRect(), old, gridScale);
  }, { passive: false });

  function applyAnchorZoom(cx, cy, rect, oldScale, newScale) {
    var fx = (cx - rect.left) / rect.width - 0.5;
    var fy = (cy - rect.top) / rect.height - 0.5;
    var dw = (newScale - oldScale) * (wrapInner.offsetWidth || rect.width);
    var dh = (newScale - oldScale) * (wrapInner.offsetHeight || rect.height);
    panX -= fx * dw;
    panY -= fy * dh;
    applyTransform();
  }

  // 移动端双指 pinch + 单指平移
  var pinchStartDist = 0;
  var pinchStartScale = 1;
  var pinchCenterX = 0, pinchCenterY = 0;
  var isPinching = false;
  var tStartPanX = 0, tStartPanY = 0;

  wrapOuter.addEventListener('touchstart', function (e) {
    // 如果事件命中 tabbar 内部控件（range/按钮/颜色选择），直接放行，不要被网格手势吞掉
    var target = e.target && e.target.closest ? e.target.closest('.tabbar, .topbar, .hint, #saveOverlay, #cellActionMenu') : null;
    if (target) return;
    // 如果有 cell 正在编辑，整图手势禁用
    if (editingCell >= 0) return;
    touchMoved = false;
    if (e.touches.length >= 2) {
      var t1 = e.touches[0], t2 = e.touches[1];
      pinchStartDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
      pinchStartScale = gridScale;
      pinchCenterX = (t1.clientX + t2.clientX) / 2;
      pinchCenterY = (t1.clientY + t2.clientY) / 2;
      isPinching = true;
      isPanning = false;
      try { if (e.cancelable) e.preventDefault(); } catch (_) {}
    } else if (e.touches.length === 1) {
      if (!isPinching && gridScale > 1.01) {
        isPanning = true;
        lastTouchX = e.touches[0].clientX;
        lastTouchY = e.touches[0].clientY;
        tStartPanX = panX; tStartPanY = panY;
      }
    }
  }, { passive: false });

  wrapOuter.addEventListener('touchmove', function (e) {
    // 放过 tabbar/topbar 内的控件手势，避免滑动条拖不动
    var target = e.target && e.target.closest ? e.target.closest('.tabbar, .topbar, .hint, #saveOverlay, #cellActionMenu') : null;
    if (target) return;
    // 如果有 cell 正在编辑，整图手势禁用
    if (editingCell >= 0) return;
    if (e.touches.length >= 2 && pinchStartDist > 0) {
      isPinching = true;
      var t1 = e.touches[0], t2 = e.touches[1];
      var d = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
      if (pinchStartDist <= 0) return;
      var ratio = d / pinchStartDist;
      var old = gridScale;
      gridScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, pinchStartScale * ratio));
      if (gridScale < 1.0) gridScale = 1.0;
      if (gridScale === 1.0) { resetPan(); applyTransform(); return; }
      applyAnchorZoom(pinchCenterX, pinchCenterY, wrapOuter.getBoundingClientRect(), old, gridScale);
      e.preventDefault();
      touchMoved = true;
    } else if (e.touches.length === 1 && isPanning) {
      var maxPanX = getMaxPan('x');
      var maxPanY = getMaxPan('y');
      var curX = e.touches[0].clientX;
      var curY = e.touches[0].clientY;
      var newPanX = tStartPanX + (curX - lastTouchX);
      var newPanY = tStartPanY + (curY - lastTouchY);
      panX = Math.max(-maxPanX, Math.min(maxPanX, newPanX));
      panY = Math.max(-maxPanY, Math.min(maxPanY, newPanY));
      applyTransform();
      if (Math.abs(curX - lastTouchX) > 2 || Math.abs(curY - lastTouchY) > 2) touchMoved = true;
      lastTouchX = curX;
      lastTouchY = curY;
      tStartPanX = panX; tStartPanY = panY;
      e.preventDefault();
    }
  }, { passive: false });

  wrapOuter.addEventListener('touchend', function (ev) {
    if (ev.touches.length === 0) {
      isPinching = false;
      pinchStartDist = 0;
      isPanning = false;
    } else if (ev.touches.length === 1 && gridScale > 1.01) {
      if (isPinching) { isPinching = false; pinchStartDist = 0; }
      isPanning = true;
      lastTouchX = ev.touches[0].clientX;
      lastTouchY = ev.touches[0].clientY;
      tStartPanX = panX; tStartPanY = panY;
    }
    if (touchMoved && ev.cancelable) { try { ev.preventDefault(); } catch (_) {} }
  });

  // 双击恢复
  var lastTap = 0;
  wrapOuter.addEventListener('touchend', function (e) {
    if (e.touches.length > 0) return;
    var now = Date.now();
    if ((now - lastTap < 300) && gridScale !== 1) {
      gridScale = 1; resetPan(); applyTransform();
      if (e.cancelable) { try { e.preventDefault(); } catch (_) {} }
    }
    lastTap = now;
  });
  wrapOuter.addEventListener('dblclick', function () {
    gridScale = 1; resetPan(); applyTransform();
  });

  /* ============== 鼠标拖拽平移：放大后支持拖动 ============== */
  var isMouseDragging = false;
  var mouseStartX = 0, mouseStartY = 0;
  var mousePanStartX = 0, mousePanStartY = 0;

  wrapOuter.addEventListener('mousedown', function (e) {
    if (editingCell >= 0) return;  // 选中 cell 时禁用整图拖拽
    if (gridScale <= 1) return;
    isMouseDragging = true;
    mouseStartX = e.clientX;
    mouseStartY = e.clientY;
    mousePanStartX = panX;
    mousePanStartY = panY;
    wrapOuter.style.cursor = 'grabbing';
    e.preventDefault();
  });

  document.addEventListener('mousemove', function (e) {
    if (!isMouseDragging) return;
    var dx = e.clientX - mouseStartX;
    var dy = e.clientY - mouseStartY;
    var maxPanX = getMaxPan('x');
    var maxPanY = getMaxPan('y');
    panX = Math.max(-maxPanX, Math.min(maxPanX, mousePanStartX + dx));
    panY = Math.max(-maxPanY, Math.min(maxPanY, mousePanStartY + dy));
    applyTransform();
  });

  document.addEventListener('mouseup', function () {
    isMouseDragging = false;
    wrapOuter.style.cursor = '';
  });

  wrapOuter.addEventListener('mouseleave', function () {
    if (editingCell >= 0) {
      var el = getEditingCellEl();
      if (el) el.style.cursor = '';
      return;
    }
    if (!isMouseDragging && gridScale > 1) {
      wrapOuter.style.cursor = 'grab';
    }
  });
  wrapOuter.addEventListener('mouseenter', function () {
    if (editingCell >= 0) {
      var el = getEditingCellEl();
      if (el) el.style.cursor = 'grab';
      return;
    }
    if (!isMouseDragging && gridScale > 1) {
      wrapOuter.style.cursor = 'grab';
    }
  });

  function getMaxPan(axis) {
    var scaledW = (gridEl.offsetWidth || 0) * gridScale;
    var scaledH = (gridEl.offsetHeight || 0) * gridScale;
    var containerW = wrapOuter.clientWidth || 0;
    var containerH = wrapOuter.clientHeight || 0;
    if (axis === 'x') {
      return Math.max(0, (scaledW - containerW) / 2);
    } else {
      return Math.max(0, (scaledH - containerH) / 2);
    }
  }

  /* ============== Cell 编辑模式：单张图片缩放/平移 ============== */
  var cellEditScale = 1;
  var cellEditPanX = 0, cellEditPanY = 0;
  var cellEditDragging = false;
  var cellEditStartX = 0, cellEditStartY = 0;
  var cellEditStartOx = 0, cellEditStartOy = 0;

  function getEditingCellEl(){
    if (editingCell < 0) return null;
    return gridEl.querySelector('.cell[data-idx="' + editingCell + '"]');
  }

  function applyCellEditTransform(scale, ox, oy){
    if (editingCell < 0) return;
    updateCellTransform(editingCell, scale, ox, oy);
    updateHint();
  }

  // 鼠标滚轮缩放选中 cell 的图片
  wrapOuter.addEventListener('wheel', function (e) {
    if (editingCell < 0) return;
    var cellEl = getEditingCellEl();
    if (!cellEl || !cellEl.classList.contains('filled')) return;
    e.preventDefault();
    var t = cellTransforms[editingCell] || {scale:1, ox:0, oy:0};
    var delta = -e.deltaY * 0.003;
    var newScale = Math.max(0.1, Math.min(5, t.scale + delta));
    applyCellEditTransform(newScale, t.ox, t.oy);
  }, { passive: false });

  // 鼠标拖拽平移选中 cell 的图片
  wrapOuter.addEventListener('mousedown', function (e) {
    if (editingCell < 0) return;
    var cellEl = getEditingCellEl();
    if (!cellEl || !cellEl.classList.contains('filled')) return;
    // 只有点击在 cell 内部才开始拖拽
    if (!cellEl.contains(e.target)) return;
    cellEditDragging = true;
    cellEditStartX = e.clientX;
    cellEditStartY = e.clientY;
    var t = cellTransforms[editingCell] || {scale:1, ox:0, oy:0};
    cellEditStartOx = t.ox;
    cellEditStartOy = t.oy;
    cellEl.style.cursor = 'grabbing';
    e.preventDefault();
  });

  document.addEventListener('mousemove', function (e) {
    if (!cellEditDragging || editingCell < 0) return;
    var cellEl = getEditingCellEl();
    if (!cellEl) { cellEditDragging = false; return; }
    var cellRect = cellEl.getBoundingClientRect();
    var cellW = cellRect.width || 1;
    var cellH = cellRect.height || 1;
    var dx = (e.clientX - cellEditStartX) / cellW;
    var dy = (e.clientY - cellEditStartY) / cellH;
    var t = cellTransforms[editingCell] || {scale:1, ox:0, oy:0};
    var newOx = Math.max(-1, Math.min(1, cellEditStartOx + dx));
    var newOy = Math.max(-1, Math.min(1, cellEditStartOy + dy));
    applyCellEditTransform(t.scale, newOx, newOy);
  });

  document.addEventListener('mouseup', function () {
    if (cellEditDragging) {
      cellEditDragging = false;
      var cellEl = getEditingCellEl();
      if (cellEl) cellEl.style.cursor = '';
    }
  });

  // 触摸手势：选中 cell 的单指平移 + 双指缩放
  var cellTouchMode = null;  // 'pan' | 'pinch' | null
  var cellTouchStartOx = 0, cellTouchStartOy = 0;
  var cellTouchStartScale = 1;
  var cellTouchStartDist = 0;

  wrapOuter.addEventListener('touchstart', function (e) {
    if (editingCell < 0) return;
    var cellEl = getEditingCellEl();
    if (!cellEl || !cellEl.classList.contains('filled')) return;
    if (!cellEl.contains(e.target)) return;
    var t = cellTransforms[editingCell] || {scale:1, ox:0, oy:0};
    if (e.touches.length >= 2) {
      var t1 = e.touches[0], t2 = e.touches[1];
      cellTouchStartDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
      cellTouchStartScale = t.scale;
      cellTouchMode = 'pinch';
      try { if (e.cancelable) e.preventDefault(); } catch(_) {}
    } else if (e.touches.length === 1) {
      cellTouchMode = 'pan';
      cellEditStartX = e.touches[0].clientX;
      cellEditStartY = e.touches[0].clientY;
      cellTouchStartOx = t.ox;
      cellTouchStartOy = t.oy;
    }
  }, { passive: false });

  wrapOuter.addEventListener('touchmove', function (e) {
    if (editingCell < 0 || !cellTouchMode) return;
    var cellEl = getEditingCellEl();
    if (!cellEl) return;
    var t = cellTransforms[editingCell] || {scale:1, ox:0, oy:0};
    if (cellTouchMode === 'pinch' && e.touches.length >= 2) {
      var t1 = e.touches[0], t2 = e.touches[1];
      var d = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
      if (cellTouchStartDist <= 0) return;
      var ratio = d / cellTouchStartDist;
      var newScale = Math.max(0.1, Math.min(5, cellTouchStartScale * ratio));
      applyCellEditTransform(newScale, t.ox, t.oy);
      try { if (e.cancelable) e.preventDefault(); } catch(_) {}
    } else if (cellTouchMode === 'pan' && e.touches.length === 1) {
      var cellRect = cellEl.getBoundingClientRect();
      var cellW = cellRect.width || 1;
      var cellH = cellRect.height || 1;
      var curX = e.touches[0].clientX;
      var curY = e.touches[0].clientY;
      var dx = (curX - cellEditStartX) / cellW;
      var dy = (curY - cellEditStartY) / cellH;
      var newOx = Math.max(-1, Math.min(1, cellTouchStartOx + dx));
      var newOy = Math.max(-1, Math.min(1, cellTouchStartOy + dy));
      applyCellEditTransform(t.scale, newOx, newOy);
      try { if (e.cancelable) e.preventDefault(); } catch(_) {}
    }
  }, { passive: false });

  wrapOuter.addEventListener('touchend', function (e) {
    if (e.touches.length === 0) {
      cellTouchMode = null;
      cellTouchStartDist = 0;
    } else if (e.touches.length === 1 && cellTouchMode === 'pinch') {
      // 双指变单指，切换到 pan 模式
      cellTouchMode = 'pan';
      cellEditStartX = e.touches[0].clientX;
      cellEditStartY = e.touches[0].clientY;
      var t = cellTransforms[editingCell] || {scale:1, ox:0, oy:0};
      cellTouchStartOx = t.ox;
      cellTouchStartOy = t.oy;
    }
  });

  // 点击 grid 空白处取消选中
  gridEl.addEventListener('click', function (e) {
    if (editingCell >= 0) {
      var cellEl = getEditingCellEl();
      if (cellEl && cellEl.contains(e.target)) return;  // 点击在 cell 内，由 cell 的 click 处理
      setEditingCell(-1);
      e.stopPropagation();
    }
  }, true);

})();
</script>
</body>
</html>
